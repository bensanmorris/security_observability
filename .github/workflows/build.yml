name: Build Container

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Containerfile'
      - 'cert_analyzer.py'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Containerfile'
      - 'cert_analyzer.py'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      tetragon_version:
        description: 'Tetragon version to build against (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/cert-analyzer
  TETRAGON_VERSION: ${{ inputs.tetragon_version || 'v1.1.0' }}

jobs:
  build:
    name: Build (UBI ${{ matrix.ubi-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubi-version: "8"
            python-version: "311"
          - ubi-version: "9"
            python-version: "311"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          # Tagged release — use the tag name (e.g. v1.2.3)
          echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          # Branch build — use the full commit SHA for precise traceability
          echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}
        flavor: |
          suffix=-ubi${{ matrix.ubi-version }},onlatest=true
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        labels: |
          org.opencontainers.image.tetragon-version=${{ env.TETRAGON_VERSION }}
          org.opencontainers.image.version=${{ steps.version.outputs.value }}

    - name: Build (and push on merge)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Containerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          UBI_VERSION=${{ matrix.ubi-version }}
          PYTHON_VERSION=${{ matrix.python-version }}
          TETRAGON_VERSION=${{ env.TETRAGON_VERSION }}
          VERSION=${{ steps.version.outputs.value }}
        cache-from: type=gha,scope=ubi${{ matrix.ubi-version }}
        cache-to: type=gha,scope=ubi${{ matrix.ubi-version }},mode=max
        platforms: linux/amd64

    - name: Build summary
      run: |
        echo "## 🐳 Container Build (UBI ${{ matrix.ubi-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Pushed:** \`${{ github.event_name != 'pull_request' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tetragon Version:** \`${{ env.TETRAGON_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY