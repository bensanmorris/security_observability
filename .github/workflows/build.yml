name: Build

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      tetragon_version:
        description: 'Tetragon version to build against (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/cert-analyzer
  TETRAGON_VERSION: ${{ inputs.tetragon_version || 'v1.1.0' }}

jobs:
  # Skip branch builds that don't touch relevant files.
  # Tag builds and PRs always run regardless of changed files.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          relevant:
            - 'Containerfile'
            - 'cert_analyzer.py'
            - 'requirements.txt'
            - 'cert-analyzer.spec'
            - 'cert-analyzer.conf'
            - 'cert-analyzer.service'
            - '.github/workflows/build.yml'

  build:
    name: Build Container (UBI ${{ matrix.ubi-version }})
    runs-on: ubuntu-latest
    needs: changes
    # Always run on tags and PRs; on branch pushes only run if relevant files changed
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.relevant == 'true'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubi-version: "8"
            python-version: "311"
          - ubi-version: "9"
            python-version: "311"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}
        flavor: |
          suffix=-ubi${{ matrix.ubi-version }},onlatest=true
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        labels: |
          org.opencontainers.image.tetragon-version=${{ env.TETRAGON_VERSION }}
          org.opencontainers.image.version=${{ steps.version.outputs.value }}

    - name: Build (and push on merge)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Containerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          UBI_VERSION=${{ matrix.ubi-version }}
          PYTHON_VERSION=${{ matrix.python-version }}
          TETRAGON_VERSION=${{ env.TETRAGON_VERSION }}
          VERSION=${{ steps.version.outputs.value }}
        cache-from: type=gha,scope=ubi${{ matrix.ubi-version }}
        cache-to: type=gha,scope=ubi${{ matrix.ubi-version }},mode=max
        platforms: linux/amd64

    - name: Build summary
      run: |
        echo "## 🐳 Container Build (UBI ${{ matrix.ubi-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Pushed:** \`${{ github.event_name != 'pull_request' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tetragon Version:** \`${{ env.TETRAGON_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    needs: changes
    # Always run on tags and PRs; on branch pushes only run if relevant files changed
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.relevant == 'true'
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    permissions:
      contents: read

    steps:
    - name: Install build prerequisites
      run: |
        dnf install -y \
          python3.11 \
          python3.11-devel \
          rpm-build \
          rpmdevtools \
          git \
          gcc \
          make \
          findutils \
          which

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fix git safe directory
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          VERSION="${{ github.ref_name }}"
          echo "value=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "release=1" >> $GITHUB_OUTPUT
        else
          SHA=$(git rev-parse --short HEAD)
          echo "value=0.0.0~git${SHA}" >> $GITHUB_OUTPUT
          echo "release=1" >> $GITHUB_OUTPUT
        fi

    - name: Set up rpmbuild tree
      run: rpmdev-setuptree

    - name: Generate Tetragon protobuf bindings
      run: |
        python3.11 -m ensurepip --upgrade
        python3.11 -m venv /tmp/proto-venv
        /tmp/proto-venv/bin/pip install --quiet \
            grpcio-tools==1.60.1 \
            protobuf==4.25.3

        git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/cilium/tetragon.git \
            /tmp/tetragon-src \
            --branch ${{ env.TETRAGON_VERSION }}
        cd /tmp/tetragon-src && git sparse-checkout set api/v1/tetragon

        mkdir -p /tmp/generated/tetragon
        /tmp/proto-venv/bin/python3.11 -m grpc_tools.protoc \
            -I /tmp/tetragon-src/api/v1 \
            --python_out=/tmp/generated \
            --grpc_python_out=/tmp/generated \
            /tmp/tetragon-src/api/v1/tetragon/*.proto

        touch /tmp/generated/tetragon/__init__.py
        echo "Protobuf bindings generated."

    - name: Create source tarball
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        TARNAME="cert-analyzer-${VERSION}"
        TMPDIR=$(mktemp -d)
        mkdir -p "${TMPDIR}/${TARNAME}"
        cp cert_analyzer.py          "${TMPDIR}/${TARNAME}/"
        cp LICENSE                   "${TMPDIR}/${TARNAME}/"
        cp cert-analyzer.service     "${TMPDIR}/${TARNAME}/"
        cp cert-analyzer.conf        "${TMPDIR}/${TARNAME}/"
        # Include pre-generated protos so the spec needs no network access
        cp -r /tmp/generated/tetragon "${TMPDIR}/${TARNAME}/tetragon"
        tar -czf "${HOME}/rpmbuild/SOURCES/${TARNAME}.tar.gz" \
            -C "${TMPDIR}" "${TARNAME}"

    - name: Copy spec file
      run: cp cert-analyzer.spec "${HOME}/rpmbuild/SPECS/cert-analyzer.spec"

    - name: Build RPM
      run: |
        rpmbuild -ba \
          --define "_topdir ${HOME}/rpmbuild" \
          --define "_version ${{ steps.version.outputs.value }}" \
          --define "_release ${{ steps.version.outputs.release }}" \
          --define "_tetragon_version ${{ env.TETRAGON_VERSION }}" \
          "${HOME}/rpmbuild/SPECS/cert-analyzer.spec"

    - name: Locate built RPM
      id: rpm
      run: |
        RPM_PATH=$(find "${HOME}/rpmbuild/RPMS" -name "cert-analyzer-*.rpm" | head -1)
        RPM_NAME=$(basename "${RPM_PATH}")
        echo "path=${RPM_PATH}" >> $GITHUB_OUTPUT
        echo "name=${RPM_NAME}" >> $GITHUB_OUTPUT

    - name: Upload RPM as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.rpm.outputs.name }}
        path: ${{ steps.rpm.outputs.path }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## 📦 RPM Build" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tetragon Version:** \`${{ env.TETRAGON_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**RPM:** \`${{ steps.rpm.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: [ build, build-rpm ]
    permissions:
      contents: write

    steps:
    - name: Download RPM artifact
      uses: actions/download-artifact@v4
      with:
        pattern: cert-analyzer-*.rpm
        merge-multiple: true
        path: ./release-assets

    - name: Locate RPM
      id: rpm
      run: |
        RPM_PATH=$(find ./release-assets -name "cert-analyzer-*.rpm" | head -1)
        echo "path=${RPM_PATH}" >> $GITHUB_OUTPUT
        echo "name=$(basename ${RPM_PATH})" >> $GITHUB_OUTPUT

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        draft: false
        files: ${{ steps.rpm.outputs.path }}
        fail_on_unmatched_files: true
        body: |
          ## cert-analyzer ${{ github.ref_name }}

          ### Container Images

          ```
          ghcr.io/${{ github.repository_owner }}/cert-analyzer:${{ github.ref_name }}-ubi8
          ghcr.io/${{ github.repository_owner }}/cert-analyzer:${{ github.ref_name }}-ubi9
          ```

          ### RPM Package

          `${{ steps.rpm.outputs.name }}` — attached below. Install with:
          ```bash
          sudo dnf install ./${{ steps.rpm.outputs.name }}
          ```

          ### Tetragon Version
          Built against Tetragon `${{ env.TETRAGON_VERSION }}`.
