name: Build

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      tetragon_version:
        description: 'Tetragon version to build against (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/cert-analyzer
  TETRAGON_VERSION: ${{ inputs.tetragon_version || 'v1.7.0' }}

jobs:
  # Skip branch builds that don't touch relevant files.
  # Tag builds and PRs always run regardless of changed files.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      test-generator: ${{ steps.filter.outputs.test-generator }}
      probe-tests: ${{ steps.filter.outputs.probe-tests }}
      java-agent: ${{ steps.filter.outputs.java-agent }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      test-server: ${{ steps.filter.outputs.test-server }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          relevant:
            - 'Containerfile'
            - 'cert_analyzer.py'
            - 'agent/**'
            - 'requirements.txt'
            - 'cert-analyzer.spec'
            - 'cert-analyzer.conf'
            - 'cert-analyzer.service'
            - 'tetragon-policies/**'
            - 'tetragon-config/**'
            - '.github/workflows/build.yml'
          test-generator:
            - 'test-cert-generator/**'
            - '.github/workflows/build.yml'
          probe-tests:
            - 'probe_tests/**'
            - '.github/workflows/build.yml'
          java-agent:
            - 'java-agent/**'
            - 'java-agent/java_agent_deployer.py'
            - 'probe_tests/java/cert-agent/**'
            - '.github/workflows/build.yml'
          dashboard:
            - 'extras/examples/grafana-dashboard.json'
            - '.github/workflows/build.yml'
          test-server:
            - 'extras/test-server/**'
            - '.github/workflows/build.yml'

  build:
    name: Build Container (UBI ${{ matrix.ubi-version }})
    runs-on: ubuntu-latest
    needs: changes
    # Always run on tags and PRs; on branch pushes only run if relevant files changed
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.relevant == 'true'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubi-version: "8"
            python-version: "311"
          - ubi-version: "9"
            python-version: "311"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          VERSION="${{ github.ref_name }}"
          echo "value=${VERSION#v}" >> $GITHUB_OUTPUT
        else
          echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Fetch Tetragon proto sources
      run: ./fetch-tetragon-src.sh "${{ env.TETRAGON_VERSION }}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}
        flavor: |
          suffix=-ubi${{ matrix.ubi-version }},onlatest=true
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        labels: |
          org.opencontainers.image.tetragon-version=${{ env.TETRAGON_VERSION }}
          org.opencontainers.image.version=${{ steps.version.outputs.value }}

    - name: Build (and push on merge)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Containerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          UBI_VERSION=${{ matrix.ubi-version }}
          PYTHON_VERSION=${{ matrix.python-version }}
          TETRAGON_VERSION=${{ env.TETRAGON_VERSION }}
          VERSION=${{ steps.version.outputs.value }}
        cache-from: type=gha,scope=ubi${{ matrix.ubi-version }}
        cache-to: type=gha,scope=ubi${{ matrix.ubi-version }},mode=max
        platforms: linux/amd64

    - name: Export container image as tar
      if: github.event_name != 'pull_request'
      id: tar
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        PULL_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:sha-${SHORT_SHA}-ubi${{ matrix.ubi-version }}"
        TAR_NAME="cert-analyzer-ubi${{ matrix.ubi-version }}-${{ steps.version.outputs.value }}.tar.gz"
        docker pull "${PULL_TAG}"
        docker save "${PULL_TAG}" | gzip > "${TAR_NAME}"
        echo "tar_name=${TAR_NAME}" >> $GITHUB_OUTPUT

    - name: Upload container image as artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: cert-analyzer-container-ubi${{ matrix.ubi-version }}-${{ steps.version.outputs.value }}
        path: ${{ steps.tar.outputs.tar_name }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## 🐳 Container Build (UBI ${{ matrix.ubi-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Pushed:** \`${{ github.event_name != 'pull_request' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tetragon Version:** \`${{ env.TETRAGON_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  build-rpm:
    name: Build RPM (RHEL ${{ matrix.ubi-version }})
    runs-on: ubuntu-latest
    needs: changes
    # Always run on tags and PRs; on branch pushes only run if relevant files changed
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.relevant == 'true'
    container:
      image: registry.access.redhat.com/ubi${{ matrix.ubi-version }}/ubi:latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ubi-version: ["8", "9"]

    steps:
    - name: Install build prerequisites
      run: |
        dnf install -y \
          python3.11 \
          python3.11-devel \
          rpm-build \
          git \
          gcc \
          make \
          findutils \
          which

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fix git safe directory
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          VERSION="${{ github.ref_name }}"
          echo "value=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "release=1" >> $GITHUB_OUTPUT
        else
          SHA=$(git rev-parse --short HEAD)
          echo "value=0.0.0~git${SHA}" >> $GITHUB_OUTPUT
          echo "release=1" >> $GITHUB_OUTPUT
        fi

    - name: Set up rpmbuild tree
      run: mkdir -p "${HOME}/rpmbuild/"{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

    - name: Generate Tetragon protobuf bindings
      run: |
        python3.11 -m ensurepip --upgrade
        python3.11 -m venv /tmp/proto-venv
        /tmp/proto-venv/bin/pip install --quiet \
            grpcio-tools==1.60.1 \
            protobuf==4.25.3

        git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/cilium/tetragon.git \
            /tmp/tetragon-src \
            --branch ${{ env.TETRAGON_VERSION }}
        cd /tmp/tetragon-src && git sparse-checkout set api/v1/tetragon

        mkdir -p /tmp/generated/tetragon
        /tmp/proto-venv/bin/python3.11 -m grpc_tools.protoc \
            -I /tmp/tetragon-src/api/v1 \
            --python_out=/tmp/generated \
            --grpc_python_out=/tmp/generated \
            /tmp/tetragon-src/api/v1/tetragon/*.proto

        touch /tmp/generated/tetragon/__init__.py
        echo "Protobuf bindings generated."

    - name: Create source tarball
      run: |
        VERSION="${{ steps.version.outputs.value }}"
        TARNAME="cert-analyzer-${VERSION}"
        TMPDIR=$(mktemp -d)
        mkdir -p "${TMPDIR}/${TARNAME}"
        cp cert_analyzer.py           "${TMPDIR}/${TARNAME}/"
        cp -r agent                   "${TMPDIR}/${TARNAME}/agent"
        cp LICENSE                    "${TMPDIR}/${TARNAME}/"
        cp cert-analyzer.service     "${TMPDIR}/${TARNAME}/"
        cp cert-analyzer.conf        "${TMPDIR}/${TARNAME}/"
        cp tetragon-config/systemd/tetragon-override.conf "${TMPDIR}/${TARNAME}/tetragon-override.conf"
        # Include pre-generated protos so the spec needs no network access
        cp -r /tmp/generated/tetragon "${TMPDIR}/${TARNAME}/tetragon"
        tar -czf "${HOME}/rpmbuild/SOURCES/${TARNAME}.tar.gz" \
            -C "${TMPDIR}" "${TARNAME}"

    - name: Copy spec file
      run: cp cert-analyzer.spec "${HOME}/rpmbuild/SPECS/cert-analyzer.spec"

    - name: Build RPM
      run: |
        rpmbuild -ba \
          --define "_topdir ${HOME}/rpmbuild" \
          --define "_version ${{ steps.version.outputs.value }}" \
          --define "_release ${{ steps.version.outputs.release }}" \
          --define "_tetragon_version ${{ env.TETRAGON_VERSION }}" \
          "${HOME}/rpmbuild/SPECS/cert-analyzer.spec"

    - name: Locate built RPMs
      id: rpm
      run: |
        RPM_PATH=$(find "${HOME}/rpmbuild/RPMS" -name "cert-analyzer-*.rpm" | head -1)
        echo "path=${RPM_PATH}" >> $GITHUB_OUTPUT
        echo "name=$(basename ${RPM_PATH})" >> $GITHUB_OUTPUT

    - name: Upload RPM as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.rpm.outputs.name }}
        path: ${{ steps.rpm.outputs.path }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## 📦 RPM Build (RHEL ${{ matrix.ubi-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tetragon Version:** \`${{ env.TETRAGON_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**RPM:** \`${{ steps.rpm.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY

  build-test-server-rpm:
    name: Build Test Server RPM (RHEL ${{ matrix.ubi-version }})
    runs-on: ubuntu-latest
    needs: changes
    # Always run on tags, PRs, and manual dispatch; on branch pushes only run
    # if extras/test-server/** changed. workflow_dispatch is included so this
    # can be built on demand from any branch without cutting a tag release --
    # see extras/test-server/TEST-SERVER-README.md.
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.test-server == 'true'
    container:
      image: registry.access.redhat.com/ubi${{ matrix.ubi-version }}/ubi:latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ubi-version: ["8", "9"]

    steps:
    - name: Install build prerequisites
      run: |
        dnf install -y \
          python3.11 \
          python3.11-devel \
          rpm-build \
          git \
          gcc \
          findutils \
          which \
          java-11-openjdk-devel

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix git safe directory
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          VERSION="${{ github.ref_name }}"
          echo "value=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "release=1" >> $GITHUB_OUTPUT
        else
          SHA=$(git rev-parse --short HEAD)
          echo "value=0.0.0~git${SHA}" >> $GITHUB_OUTPUT
          echo "release=1" >> $GITHUB_OUTPUT
        fi

    - name: Build RPM
      run: |
        bash extras/test-server/build-rpm.sh \
          --version "${{ steps.version.outputs.value }}" \
          --release "${{ steps.version.outputs.release }}"

    - name: Locate built RPM
      id: rpm
      run: |
        RPM_PATH=$(find "${HOME}/rpmbuild/RPMS" -name "certsight-test-server-*.rpm" | head -1)
        echo "path=${RPM_PATH}" >> $GITHUB_OUTPUT
        echo "name=$(basename ${RPM_PATH})" >> $GITHUB_OUTPUT

    - name: Upload RPM as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.rpm.outputs.name }}
        path: ${{ steps.rpm.outputs.path }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## 📦 Test Server RPM Build (RHEL ${{ matrix.ubi-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**RPM:** \`${{ steps.rpm.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY

  build-test-server-container:
    name: Build Test Server Container (UBI ${{ matrix.ubi-version }})
    runs-on: ubuntu-latest
    needs: changes
    # Same trigger conditions as build-test-server-rpm -- workflow_dispatch is
    # included so this can be built on demand from any branch without cutting
    # a tag release, see extras/test-server/TEST-SERVER-README.md.
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.test-server == 'true'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - ubi-version: "8"
            python-version: "311"
          - ubi-version: "9"
            python-version: "311"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cert-test-server
        flavor: |
          suffix=-ubi${{ matrix.ubi-version }},onlatest=true
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build (and push on merge)
      uses: docker/build-push-action@v5
      with:
        context: extras/test-server
        file: extras/test-server/Containerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          UBI_VERSION=${{ matrix.ubi-version }}
          PYTHON_VERSION=${{ matrix.python-version }}
        cache-from: type=gha,scope=test-server-ubi${{ matrix.ubi-version }}
        cache-to: type=gha,scope=test-server-ubi${{ matrix.ubi-version }},mode=max
        platforms: linux/amd64

    - name: Export container image as tar
      if: github.event_name != 'pull_request'
      id: tar
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        PULL_TAG="${{ env.REGISTRY }}/${{ github.repository_owner }}/cert-test-server:sha-${SHORT_SHA}-ubi${{ matrix.ubi-version }}"
        TAR_NAME="cert-test-server-ubi${{ matrix.ubi-version }}-${{ steps.version.outputs.value }}.tar.gz"
        docker pull "${PULL_TAG}"
        docker save "${PULL_TAG}" | gzip > "${TAR_NAME}"
        echo "tar_name=${TAR_NAME}" >> $GITHUB_OUTPUT

    - name: Upload container image as artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: cert-test-server-container-ubi${{ matrix.ubi-version }}-${{ steps.version.outputs.value }}
        path: ${{ steps.tar.outputs.tar_name }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## 🐳 Test Server Container Build (UBI ${{ matrix.ubi-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Pushed:** \`${{ github.event_name != 'pull_request' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  build-policies:
    name: Build Tetragon Policies Archive
    runs-on: ubuntu-latest
    needs: changes
    # Always run on tags and PRs; on branch pushes only run if relevant or dashboard files changed
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.relevant == 'true' ||
      needs.changes.outputs.dashboard == 'true'
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Build policies archive
      id: archive
      run: |
        ARCHIVE_NAME="tetragon-policies-${{ steps.version.outputs.value }}.tar.gz"
        tar -czf "${ARCHIVE_NAME}" tetragon-policies/
        echo "name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
        echo "path=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
        echo "Contents:"
        tar -tzf "${ARCHIVE_NAME}"

    - name: Upload policies archive as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.archive.outputs.name }}
        path: ${{ steps.archive.outputs.path }}
        retention-days: 30

    - name: Package Grafana dashboard
      id: dashboard
      run: |
        DASHBOARD_NAME="grafana-dashboard-${{ steps.version.outputs.value }}.json"
        cp extras/examples/grafana-dashboard.json "${DASHBOARD_NAME}"
        echo "name=${DASHBOARD_NAME}" >> $GITHUB_OUTPUT
        echo "path=${DASHBOARD_NAME}" >> $GITHUB_OUTPUT

    - name: Upload Grafana dashboard as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.dashboard.outputs.name }}
        path: ${{ steps.dashboard.outputs.path }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## 📋 Tetragon Policies Archive" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Archive:** \`${{ steps.archive.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Policies included:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tar -tzf "${{ steps.archive.outputs.path }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Grafana dashboard:** \`${{ steps.dashboard.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY

  build-test-generator:
    name: Build Test Cert Generator (test-cert-generator)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.test-generator == 'true'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cert-test-generator
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build (and push on merge)
      uses: docker/build-push-action@v5
      with:
        context: test-cert-generator
        file: test-cert-generator/Containerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          UBI_VERSION=9
          PYTHON_VERSION=311
        cache-from: type=gha,scope=test-generator
        cache-to: type=gha,scope=test-generator,mode=max
        platforms: linux/amd64

    - name: Export container image as tar
      if: github.event_name != 'pull_request'
      id: tar
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        PULL_TAG="${{ env.REGISTRY }}/${{ github.repository_owner }}/cert-test-generator:sha-${SHORT_SHA}"
        TAR_NAME="cert-test-generator-${{ steps.version.outputs.value }}.tar.gz"
        docker pull "${PULL_TAG}"
        docker save "${PULL_TAG}" | gzip > "${TAR_NAME}"
        echo "tar_name=${TAR_NAME}" >> $GITHUB_OUTPUT

    - name: Upload container image as artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: cert-test-generator-container-${{ steps.version.outputs.value }}
        path: ${{ steps.tar.outputs.tar_name }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## 🧪 Test Cert Generator (test-cert-generator)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Pushed:** \`${{ github.event_name != 'pull_request' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deploy to kind:**" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "kind load docker-image ghcr.io/${{ github.repository_owner }}/cert-test-generator:latest" >> $GITHUB_STEP_SUMMARY
        echo "kubectl apply -f test-cert-generator/job.yaml" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  build-probe-tests:
    name: Build Probe Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.probe-tests == 'true'
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    permissions:
      contents: read

    steps:
    - name: Install build prerequisites
      run: |
        dnf install -y \
          cmake \
          gcc-c++ \
          make \
          openssl-devel \
          java-11-openjdk-devel \
          nss-tools

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "value=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Build probe tests
      run: |
        cmake -S probe_tests -B probe_tests/build
        cmake --build probe_tests/build

    - name: Build Java probe tests
      run: |
        javac -encoding UTF-8 probe_tests/java/FipsJavaCertLoad.java
        javac -encoding UTF-8 probe_tests/java/CertAgentTest.java

    - name: Package probe tests archive
      id: archive
      run: |
        ARCHIVE_NAME="probe-tests-${{ steps.version.outputs.value }}.tar.gz"
        mkdir -p probe-tests-stage/java
        cp probe_tests/build/test_openssl3_cert_load        probe-tests-stage/
        cp probe_tests/java/FipsJavaCertLoad.class          probe-tests-stage/java/
        cp probe_tests/java/FipsJavaCertLoad.java           probe-tests-stage/java/
        cp probe_tests/java/CertAgentTest.class             probe-tests-stage/java/
        cp probe_tests/java/CertAgentTest.java              probe-tests-stage/java/
        cp probe_tests/test_tls_port_probe.py               probe-tests-stage/
        cp probe_tests/test_tcp_connect_probe.py            probe-tests-stage/
        cp probe_tests/README.md                            probe-tests-stage/
        tar -czf "${ARCHIVE_NAME}" -C probe-tests-stage .
        echo "name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
        echo "path=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

    - name: Upload probe tests archive as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.archive.outputs.name }}
        path: ${{ steps.archive.outputs.path }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## 🔬 Probe Tests" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Archive:** \`${{ steps.archive.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Contents:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tar -tzf "${{ steps.archive.outputs.path }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  build-java-agent-rpms:
    name: Build Java Agent RPMs (RHEL ${{ matrix.ubi-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.ref_type == 'tag' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.java-agent == 'true'
    container:
      image: registry.access.redhat.com/ubi${{ matrix.ubi-version }}/ubi:latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ubi-version: ["8", "9"]

    steps:
    - name: Install build prerequisites
      run: |
        dnf install -y --allowerasing \
          java-11-openjdk-devel \
          gcc \
          make \
          rpm-build \
          git \
          curl \
          findutils \
          which \
          checkpolicy \
          policycoreutils

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fix git safe directory
      run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

    - name: Determine version string
      id: version
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          VERSION="${{ github.ref_name }}"
          echo "value=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "release=1" >> $GITHUB_OUTPUT
        else
          SHA=$(git rev-parse --short HEAD)
          echo "value=0.0.0~git${SHA}" >> $GITHUB_OUTPUT
          echo "release=1" >> $GITHUB_OUTPUT
        fi

    - name: Build cert-agent.jar
      run: |
        cd probe_tests/java/cert-agent
        JAVA_HOME=$(readlink -f /usr/bin/javac | sed 's|/bin/javac||')
        export JAVA_HOME
        ASM_VER="9.7"
        MAVEN="https://repo1.maven.org/maven2/org/ow2/asm"
        mkdir -p .deps
        curl -sSfL "${MAVEN}/asm/${ASM_VER}/asm-${ASM_VER}.jar"             -o ".deps/asm-${ASM_VER}.jar"
        curl -sSfL "${MAVEN}/asm-commons/${ASM_VER}/asm-commons-${ASM_VER}.jar" -o ".deps/asm-commons-${ASM_VER}.jar"
        mkdir -p classes fat/asm_extract
        javac -source 11 -target 11 -encoding UTF-8 \
            -cp ".deps/asm-${ASM_VER}.jar:.deps/asm-commons-${ASM_VER}.jar" \
            -d classes \
            src/com/security/certagent/*.java
        (cd fat/asm_extract \
            && jar xf "../../.deps/asm-${ASM_VER}.jar" \
            && jar xf "../../.deps/asm-commons-${ASM_VER}.jar")
        rm -rf fat/asm_extract/META-INF
        cp -r classes/. fat/asm_extract/
        jar cfm cert-agent.jar MANIFEST.MF -C fat/asm_extract .
        echo "Built cert-agent.jar ($(du -sh cert-agent.jar | cut -f1))"

    - name: Set up rpmbuild tree
      run: mkdir -p "${HOME}/rpmbuild/"{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

    - name: Build RPMs
      run: |
        bash java-agent/build-rpm.sh \
          --version "${{ steps.version.outputs.value }}" \
          --release "${{ steps.version.outputs.release }}"

    - name: Locate built RPMs
      id: rpms
      run: |
        JNI_RPM=$(find "${HOME}/rpmbuild/RPMS" -name "cert-agent-jni-*.rpm" | head -1)
        DEP_RPM=$(find "${HOME}/rpmbuild/RPMS" -name "cert-agent-deployer-*.rpm" | head -1)
        echo "jni_path=${JNI_RPM}"        >> $GITHUB_OUTPUT
        echo "jni_name=$(basename ${JNI_RPM})" >> $GITHUB_OUTPUT
        echo "dep_path=${DEP_RPM}"        >> $GITHUB_OUTPUT
        echo "dep_name=$(basename ${DEP_RPM})" >> $GITHUB_OUTPUT

    - name: Upload cert-agent-jni RPM
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.rpms.outputs.jni_name }}
        path: ${{ steps.rpms.outputs.jni_path }}
        retention-days: 30

    - name: Upload cert-agent-deployer RPM
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.rpms.outputs.dep_name }}
        path: ${{ steps.rpms.outputs.dep_path }}
        retention-days: 30

    - name: Build summary
      run: |
        echo "## Java Agent RPMs (RHEL ${{ matrix.ubi-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Packages:**" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ steps.rpms.outputs.jni_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ steps.rpms.outputs.dep_name }}\`" >> $GITHUB_STEP_SUMMARY

  build-analyzer-ami:
    name: Build CertSight Analyzer AMI
    runs-on: ubuntu-latest
    # Tag-only, unlike every other build-* job here -- this launches a real,
    # billed EC2 instance via Packer to bake the AMI. Running it on every PR
    # or branch push (like the RPM/container jobs above, which cost nothing
    # extra) would mean an AWS cost on every commit; a tagged release is the
    # only event where publishing a new AMI is actually intended.
    #
    # Requires repo secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
    # AWS_REGION with permission to launch/terminate EC2 instances and
    # register AMIs -- not configured yet as of this job's addition, so this
    # will fail until an operator adds them in the repo's Settings > Secrets.
    if: github.ref_type == 'tag'
    needs: changes
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

    - uses: hashicorp/setup-packer@v3

    - name: packer init
      working-directory: extras/aws-marketplace/packer
      run: packer init analyzer.pkr.hcl

    - name: packer build
      working-directory: extras/aws-marketplace/packer
      run: |
        packer build \
          -var "certsight_version=${{ github.ref_name }}" \
          -var "aws_region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
          analyzer.pkr.hcl

    - name: Read resulting AMI ID
      id: ami
      working-directory: extras/aws-marketplace/packer
      run: |
        AMI_ID=$(python3 -c "import json; print(json.load(open('analyzer-manifest.json'))['builds'][-1]['artifact_id'].split(':')[1])")
        echo "ami_id=${AMI_ID}" >> $GITHUB_OUTPUT

    - name: Upload manifest as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: analyzer-ami-manifest-${{ github.ref_name }}
        path: extras/aws-marketplace/packer/analyzer-manifest.json
        retention-days: 90

    - name: Build summary
      run: |
        echo "## CertSight Analyzer AMI" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Region:** \`${{ secrets.AWS_REGION || 'us-east-1' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**AMI ID:** \`${{ steps.ami.outputs.ami_id }}\`" >> $GITHUB_STEP_SUMMARY

  build-dashboard-ami:
    name: Build CertSight Dashboard AMI
    runs-on: ubuntu-latest
    # Same tag-only/cost rationale as build-analyzer-ami above.
    if: github.ref_type == 'tag'
    needs: changes
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

    - uses: hashicorp/setup-packer@v3

    - name: packer init
      working-directory: extras/aws-marketplace/packer
      run: packer init dashboard.pkr.hcl

    - name: packer build
      working-directory: extras/aws-marketplace/packer
      run: |
        packer build \
          -var "certsight_version=${{ github.ref_name }}" \
          -var "aws_region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
          dashboard.pkr.hcl

    - name: Read resulting AMI ID
      id: ami
      working-directory: extras/aws-marketplace/packer
      run: |
        AMI_ID=$(python3 -c "import json; print(json.load(open('dashboard-manifest.json'))['builds'][-1]['artifact_id'].split(':')[1])")
        echo "ami_id=${AMI_ID}" >> $GITHUB_OUTPUT

    - name: Upload manifest as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: dashboard-ami-manifest-${{ github.ref_name }}
        path: extras/aws-marketplace/packer/dashboard-manifest.json
        retention-days: 90

    - name: Build summary
      run: |
        echo "## CertSight Dashboard AMI" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Region:** \`${{ secrets.AWS_REGION || 'us-east-1' }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**AMI ID:** \`${{ steps.ami.outputs.ami_id }}\`" >> $GITHUB_STEP_SUMMARY

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    # Deliberately does NOT depend on build-analyzer-ami/build-dashboard-ami
    # above: those need AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY repo secrets
    # that don't exist yet (see their own comments), so they're expected to
    # fail on every tag until an operator adds them. Gating this job on them
    # would silently block the RPM/container release that already works
    # today. Once the secrets exist and both AMI jobs are proven reliable,
    # add them to this needs: list and wire their ami_id outputs into the
    # release body below.
    needs: [ build, build-rpm, build-policies, build-test-generator, build-probe-tests, build-java-agent-rpms, build-test-server-rpm, build-test-server-container ]
    permissions:
      contents: write

    steps:
    - name: Download RPM artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: cert-analyzer*.rpm
        merge-multiple: true
        path: ./release-assets

    - name: Download policies archive artifact
      uses: actions/download-artifact@v4
      with:
        pattern: tetragon-policies-*.tar.gz
        merge-multiple: true
        path: ./release-assets

    - name: Download cert-analyzer container artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: cert-analyzer-container-ubi*
        merge-multiple: true
        path: ./release-assets

    - name: Download cert-test-generator container artifact
      uses: actions/download-artifact@v4
      with:
        pattern: cert-test-generator-container-*
        merge-multiple: true
        path: ./release-assets

    - name: Download probe tests artifact
      uses: actions/download-artifact@v4
      with:
        pattern: probe-tests-*.tar.gz
        merge-multiple: true
        path: ./release-assets

    - name: Download Java agent RPM artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: cert-agent-*.rpm
        merge-multiple: true
        path: ./release-assets

    - name: Download Test Server RPM artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: certsight-test-server-*.rpm
        merge-multiple: true
        path: ./release-assets

    - name: Download cert-test-server container artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: cert-test-server-container-*
        merge-multiple: true
        path: ./release-assets

    - name: Download Grafana dashboard artifact
      uses: actions/download-artifact@v4
      with:
        pattern: grafana-dashboard-*.json
        merge-multiple: true
        path: ./release-assets

    - name: Locate release assets
      id: assets
      run: |
        POLICIES_PATH=$(find ./release-assets -name "tetragon-policies-*.tar.gz" | head -1)
        CONTAINER_UBI8_PATH=$(find ./release-assets -name "cert-analyzer-ubi8-*.tar.gz" | head -1)
        CONTAINER_UBI9_PATH=$(find ./release-assets -name "cert-analyzer-ubi9-*.tar.gz" | head -1)
        GENERATOR_PATH=$(find ./release-assets -name "cert-test-generator-*.tar.gz" | head -1)
        echo "policies_path=${POLICIES_PATH}" >> $GITHUB_OUTPUT
        echo "policies_name=$(basename ${POLICIES_PATH})" >> $GITHUB_OUTPUT
        echo "container_ubi8_path=${CONTAINER_UBI8_PATH}" >> $GITHUB_OUTPUT
        echo "container_ubi8_name=$(basename ${CONTAINER_UBI8_PATH})" >> $GITHUB_OUTPUT
        echo "container_ubi9_path=${CONTAINER_UBI9_PATH}" >> $GITHUB_OUTPUT
        echo "container_ubi9_name=$(basename ${CONTAINER_UBI9_PATH})" >> $GITHUB_OUTPUT
        echo "generator_path=${GENERATOR_PATH}" >> $GITHUB_OUTPUT
        echo "generator_name=$(basename ${GENERATOR_PATH})" >> $GITHUB_OUTPUT
        PROBE_TESTS_PATH=$(find ./release-assets -name "probe-tests-*.tar.gz" | head -1)
        echo "probe_tests_path=${PROBE_TESTS_PATH}" >> $GITHUB_OUTPUT
        echo "probe_tests_name=$(basename ${PROBE_TESTS_PATH})" >> $GITHUB_OUTPUT
        DASHBOARD_PATH=$(find ./release-assets -name "grafana-dashboard-*.json" | head -1)
        echo "dashboard_path=${DASHBOARD_PATH}" >> $GITHUB_OUTPUT
        echo "dashboard_name=$(basename ${DASHBOARD_PATH})" >> $GITHUB_OUTPUT
        TEST_SERVER_UBI8_PATH=$(find ./release-assets -name "certsight-test-server-*.el8*.rpm" | head -1)
        echo "test_server_ubi8_name=$(basename ${TEST_SERVER_UBI8_PATH})" >> $GITHUB_OUTPUT
        TEST_SERVER_UBI9_PATH=$(find ./release-assets -name "certsight-test-server-*.el9*.rpm" | head -1)
        echo "test_server_ubi9_name=$(basename ${TEST_SERVER_UBI9_PATH})" >> $GITHUB_OUTPUT
        TEST_SERVER_CONTAINER_UBI8_PATH=$(find ./release-assets -name "cert-test-server-ubi8-*.tar.gz" | head -1)
        echo "test_server_container_ubi8_path=${TEST_SERVER_CONTAINER_UBI8_PATH}" >> $GITHUB_OUTPUT
        echo "test_server_container_ubi8_name=$(basename ${TEST_SERVER_CONTAINER_UBI8_PATH})" >> $GITHUB_OUTPUT
        TEST_SERVER_CONTAINER_UBI9_PATH=$(find ./release-assets -name "cert-test-server-ubi9-*.tar.gz" | head -1)
        echo "test_server_container_ubi9_path=${TEST_SERVER_CONTAINER_UBI9_PATH}" >> $GITHUB_OUTPUT
        echo "test_server_container_ubi9_name=$(basename ${TEST_SERVER_CONTAINER_UBI9_PATH})" >> $GITHUB_OUTPUT

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        draft: false
        files: |
          ./release-assets/cert-analyzer*.rpm
          ./release-assets/cert-agent-jni-*.rpm
          ./release-assets/cert-agent-deployer-*.rpm
          ./release-assets/certsight-test-server-*.rpm
          ${{ steps.assets.outputs.policies_path }}
          ${{ steps.assets.outputs.container_ubi8_path }}
          ${{ steps.assets.outputs.container_ubi9_path }}
          ${{ steps.assets.outputs.generator_path }}
          ${{ steps.assets.outputs.probe_tests_path }}
          ${{ steps.assets.outputs.dashboard_path }}
          ${{ steps.assets.outputs.test_server_container_ubi8_path }}
          ${{ steps.assets.outputs.test_server_container_ubi9_path }}
        fail_on_unmatched_files: true
        body: |
          ## cert-analyzer ${{ github.ref_name }}

          ### Container Images

          Pull from GHCR:
          ```
          ghcr.io/${{ github.repository_owner }}/cert-analyzer:${{ github.ref_name }}-ubi8
          ghcr.io/${{ github.repository_owner }}/cert-analyzer:${{ github.ref_name }}-ubi9
          ghcr.io/${{ github.repository_owner }}/cert-test-generator:${{ github.ref_name }}
          ghcr.io/${{ github.repository_owner }}/cert-test-server:${{ github.ref_name }}-ubi8
          ghcr.io/${{ github.repository_owner }}/cert-test-server:${{ github.ref_name }}-ubi9
          ```

          Or load from the attached tar files (for locked-down/air-gapped hosts with no
          registry egress — download the tar elsewhere, copy it over, then `podman load`):
          ```bash
          docker load < ${{ steps.assets.outputs.container_ubi8_name }}
          docker load < ${{ steps.assets.outputs.container_ubi9_name }}
          docker load < ${{ steps.assets.outputs.generator_name }}
          docker load < ${{ steps.assets.outputs.test_server_container_ubi8_name }}
          docker load < ${{ steps.assets.outputs.test_server_container_ubi9_name }}
          ```

          For OpenShift installs on a locked-down host that can't build images locally, see
          `extras/openshift/scripts/deploy-cert-analyzer-from-release.sh` and
          `extras/openshift/scripts/deploy-test-server-from-release.sh` — they load one of
          these tars and push it into the cluster's internal registry for you.

          ### RPM Packages

          RPMs for RHEL 8 (`.el8`) and RHEL 9 (`.el9`) are attached below.

          **cert-analyzer** (Tetragon event consumer):
          ```bash
          sudo dnf install ./cert-analyzer-<version>.el8.x86_64.rpm   # RHEL 8
          sudo dnf install ./cert-analyzer-<version>.el9.x86_64.rpm   # RHEL 9
          ```

          **Java agent** (JVM certificate interception — install on hosts running JVMs):
          ```bash
          # Install the JNI stub and agent JAR
          sudo dnf install ./cert-agent-jni-<version>.el9.x86_64.rpm
          # Install the deployer daemon (attaches the agent to running JVMs)
          sudo dnf install ./cert-agent-deployer-<version>.el9.x86_64.rpm
          sudo systemctl enable --now cert-agent-deployer
          ```

          **certsight-test-server** (local web console for exercising certificate detections — bundles its own venv, no pip/internet access needed on the target host):
          ```bash
          sudo dnf install ./${{ steps.assets.outputs.test_server_ubi8_name }}   # RHEL 8
          sudo dnf install ./${{ steps.assets.outputs.test_server_ubi9_name }}   # RHEL 9
          certsight-test-server --kafka-host localhost --kafka-port 9092
          ```
          See `extras/test-server/TEST-SERVER-README.md` for prerequisites and how the detection pipeline works end to end. A container image is also published (see Container Images above) for running it in-cluster instead of installing the RPM directly on a host.

          ### Tetragon Policies (tar.gz)

          Policies are shipped separately so they can be updated independently of the agent. `${{ steps.assets.outputs.policies_name }}` is attached below.

          ```bash
          tar -xzf ${{ steps.assets.outputs.policies_name }}

          # Detects your RHEL version, loads all appropriate policies, and persists
          # them to /etc/tetragon/tetragon.tp.d/ so they survive Tetragon restarts:
          sudo bash tetragon-policies/apply-policies.sh
          ```

          ### Probe Tests

          `${{ steps.assets.outputs.probe_tests_name }}` — attached below. Native binaries (built on RHEL 9 / UBI 9) for manually exercising Tetragon uprobe hooks. Run with Tetragon active to confirm `cert_analyzer.py` receives the expected events:
          ```bash
          tar -xzf ${{ steps.assets.outputs.probe_tests_name }}
          ./test_openssl3_cert_load /path/to/cert.pem
          ```

          ### Grafana Dashboard

          `${{ steps.assets.outputs.dashboard_name }}` — attached below. Import into Grafana via **Dashboards → Import → Upload JSON file**. Requires Prometheus to be configured to scrape cert-analyzer metrics. See `extras/examples/` in the repository for a reference Prometheus scrape config.

          ### Tetragon Version
          Built against Tetragon `${{ env.TETRAGON_VERSION }}`.
