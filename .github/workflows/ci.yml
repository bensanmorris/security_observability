name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 6am UTC
    - cron: '0 6 * * *'

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort
    
    - name: Check code formatting with Black
      run: |
        black --check cert_analyzer.py agent/ test_cert_analyzer.py test_fips_compliance_checker.py || true

    - name: Check import sorting with isort
      run: |
        isort --check-only cert_analyzer.py agent/ test_cert_analyzer.py test_fips_compliance_checker.py || true

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 cert_analyzer.py agent/ test_cert_analyzer.py test_fips_compliance_checker.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 cert_analyzer.py agent/ test_cert_analyzer.py test_fips_compliance_checker.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run Bandit security scan
      # No `|| true`: every current finding is either fixed or has a specific,
      # reasoned `# nosec BXXX` annotation at its call site (see agent/*.py) --
      # a new, un-annotated finding should fail the build.
      run: |
        bandit -r cert_analyzer.py agent/ -f json -o bandit-report.json
        bandit -r cert_analyzer.py agent/

    - name: Check dependencies for vulnerabilities
      # Scans only requirements.txt (the actual shipped runtime dependencies),
      # not the ambient environment -- otherwise this also reports on bandit's/
      # safety's own transitive dependencies (nltk, filelock, requests, ...),
      # which never ship in the production container and aren't this
      # project's to fix. .safety-policy.yml documents, with a dated reason
      # each, the currently-known CVEs in pinned deps that are deferred
      # pending a tested cryptography/protobuf upgrade -- anything not listed
      # there fails the build. No `|| true`.
      run: |
        safety check -r requirements.txt --policy-file .safety-policy.yml

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r test-requirements.txt

    - name: Run tests with coverage
      # A single run generates both the verbose pass/fail output and the
      # coverage numbers -- previously the whole suite ran twice (once
      # plain, once for coverage), doubling this job's runtime for no
      # benefit. 80% is a real floor just under current measured coverage
      # (~84%), so a genuine regression fails the build; it isn't the
      # stale "35%" placeholder this replaced, which was roughly half of
      # what the suite already achieved and so never actually caught
      # anything.
      run: |
        pytest test_cert_analyzer.py test_fips_compliance_checker.py \
          -v --tb=short --strict-markers \
          --cov=cert_analyzer \
          --cov=agent \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=80

    - name: Upload coverage to Codecov
      if: always() && matrix.python-version == '3.9'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: py${{ matrix.python-version }}

    - name: Archive coverage HTML report
      if: always() && matrix.python-version == '3.9'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

    - name: Coverage Summary
      # Generated from this run's own coverage data (not a hardcoded
      # figure) so it can't silently drift out of date the way the
      # previous static "~39%, Tetragon/gRPC/metrics untested" summary
      # did -- all of those areas have since gained extensive test
      # coverage and that text was long stale.
      if: always() && matrix.python-version == '3.9'
      run: |
        echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        coverage report --include="cert_analyzer.py,agent/*" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "✅ All tests passed!"
          exit 0
        else
          echo "❌ Tests failed"
          exit 1
        fi
