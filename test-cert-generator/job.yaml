# Deploys the test cert generator as a long-running Deployment in kind.
#
# The container regenerates all PEM/JKS/PKCS12 test certificates every
# CERT_REGEN_INTERVAL_SECONDS (default 60) seconds, writing them to /test-certs
# which is backed by a hostPath on the kind node.
#
# cert-analyzer (kubernetes/deployment.yaml) mounts the host root at /host and
# scans CERT_SCAN_PATHS — add /host/tmp/cert-analyzer-test to that env var so
# the analyzer picks up these certs automatically.
#
# Usage:
#   kind load docker-image ghcr.io/<owner>/cert-test-generator:latest
#   kubectl apply -f test-cert-generator/job.yaml
#   kubectl -n kube-system logs -f deployment/cert-test-generator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-test-generator
  namespace: kube-system
  labels:
    app: cert-test-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-test-generator
  template:
    metadata:
      labels:
        app: cert-test-generator
    spec:
      containers:
      - name: cert-test-generator
        image: ghcr.io/bensanmorris/cert-test-generator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: TEST_CERT_OUTPUT_DIR
          value: /test-certs
        - name: CERT_REGEN_INTERVAL_SECONDS
          value: "60"
        volumeMounts:
        - name: test-certs
          mountPath: /test-certs
        resources:
          limits:
            memory: 128Mi
            cpu: 200m
          requests:
            memory: 64Mi
            cpu: 100m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1001
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: test-certs
        hostPath:
          # Certs land here on the kind node — add /host/tmp/cert-analyzer-test
          # to cert-analyzer's CERT_SCAN_PATHS to have them picked up automatically.
          path: /tmp/cert-analyzer-test
          type: DirectoryOrCreate
