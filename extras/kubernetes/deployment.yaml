apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-expiry-monitor
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cert-expiry-monitor
  namespace: kube-system
  labels:
    app: cert-expiry-monitor
spec:
  selector:
    matchLabels:
      app: cert-expiry-monitor
  template:
    metadata:
      labels:
        app: cert-expiry-monitor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: cert-expiry-monitor
      hostNetwork: true
      hostPID: true
      containers:
      - name: analyzer
        image: localhost/cert-analyzer:latest
        imagePullPolicy: Never
        env:
        - name: TETRAGON_ADDR
          # cilium/tetragon 1.6+ serves the gRPC socket from /var/run/tetragon, not
          # /var/run/cilium/tetragon (that path is only used for the JSON export log file) -
          # confirmed against the chart's daemonset.yaml and _container_tetragon.tpl.
          value: "unix:///var/run/tetragon/tetragon.sock"
        - name: METRICS_PORT
          value: "9090"
        - name: HEALTH_PORT
          value: "8086"
        - name: ALERT_THRESHOLD_DAYS
          value: "30"
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: CERT_SCAN_PATHS
          value: "/host/etc/ssl,/host/etc/pki,/host/etc/kubernetes/pki"
        - name: SCAN_INTERVAL_SECONDS
          value: "3600"
        - name: READINESS_GRACE_PERIOD_SECONDS
          value: "60"
        - name: READINESS_STALENESS_SECONDS
          value: "300"
        - name: HOST_PREFIX
          value: "/host"
        volumeMounts:
        - name: tetragon-sock
          mountPath: /var/run/tetragon
        - name: host-root
          mountPath: /host
          readOnly: true
        resources:
          limits:
            # Doubled from 256Mi after a soak test (see extras/openshift/daemonset.yaml and
            # probe_tests/openshift-soak/) OOMKilled the container at 67 minutes under sustained
            # load. The app's own cert_analyzer_process_rss_bytes never exceeded ~196MB, and
            # cert_analyzer_cache_known_certs_size was nowhere near its 10,000-entry cap, so this
            # wasn't the known_certs cache growing unbounded -- the working theory is cgroup
            # page-cache pressure from the sheer volume of cert file reads (thousands/minute on a
            # busy node) counting against the container's memory.max even though the process's
            # own heap looked fine. This is generic cgroup v2 accounting behavior, not specific
            # to OpenShift/RHCOS, so the same fix applies here.
            memory: 512Mi
            cpu: 200m
          requests:
            memory: 128Mi
            cpu: 100m
        ports:
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 8086
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 2
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1001
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: tetragon-sock
        hostPath:
          path: /var/run/tetragon
          type: DirectoryOrCreate
      - name: host-root
        hostPath:
          path: /
          type: Directory
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: cert-expiry-monitor
  namespace: kube-system
  labels:
    app: cert-expiry-monitor
spec:
  selector:
    app: cert-expiry-monitor
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: health
    port: 8086
    targetPort: 8086
    protocol: TCP
  type: ClusterIP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-expiry-monitor-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-expiry-monitor-pod-reader
subjects:
  - kind: ServiceAccount
    name: cert-expiry-monitor
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cert-expiry-monitor-pod-reader
  apiGroup: rbac.authorization.k8s.io
