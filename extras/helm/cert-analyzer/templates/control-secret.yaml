{{- if and .Values.control.enabled (not .Values.control.existingSecret) (not (and .Values.control.tls.existingSecret .Values.control.tls.requireClientCert)) }}
{{- $token := required "control.token or control.existingSecret (or control.tls.existingSecret for mutual TLS) is required when control.enabled=true -- generate with: python3 -c 'import secrets; print(secrets.token_urlsafe(32))'" .Values.control.token }}
{{- end }}
{{- if and .Values.control.enabled (not .Values.control.existingSecret) .Values.control.token }}
{{- $token := .Values.control.token }}
{{- if lt (len $token) 16 }}
{{- fail "control.token must be at least 16 characters (cert-analyzer refuses shorter tokens and leaves control off)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cert-analyzer.controlSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-analyzer.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
