{{- if .Values.demo.prometheus.enabled }}
# Minimal standalone Prometheus for the test-console's "Certificate blast radius explorer" /
# "Certificate chain explorer" links -- both query a real Prometheus's /api/v1/query API for
# cert-analyzer's own tls_certificate_* series; cert-analyzer's own :9090 only exposes raw
# /metrics for scraping, not a query API. Deliberately its own throwaway instance scraping
# only cert-expiry-monitor, not OpenShift's User Workload Monitoring stack -- UWM needs
# bearer-token auth + TLS through Thanos Querier's RBAC proxy that blast_radius.py/
# chain_explorer.py's plain urllib.request.urlopen() calls don't handle. Purely a demo/test
# dependency, same reasoning as the test-server Pod's own SCC grant.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    # 60s, not the Prometheus default 15s -- matches cert-analyzer's own
    # min_scrape_interval_seconds (agent/config.py, default 60s), which replays a cached
    # /metrics reply to any scrape landing sooner than that. Keep in sync if either changes.
    global:
      scrape_interval: 60s
    scrape_configs:
    - job_name: cert-expiry-monitor
      static_configs:
      - targets: ["cert-expiry-monitor.{{ .Release.Namespace }}.svc:9090"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: demo-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-prometheus
  template:
    metadata:
      labels:
        app: demo-prometheus
    spec:
      # Matches cert-expiry-monitor's priorityClassName -- without it this backs the
      # test-console's blast-radius/chain-explorer panels but sits at the lowest scheduling
      # priority, same preemption risk on a memory-constrained single-node cluster.
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
      - name: prometheus
        image: {{ .Values.demo.prometheus.image | quote }}
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=6h
        ports:
        - containerPort: 9090
          name: http
        resources:
          {{- toYaml .Values.demo.prometheus.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: demo-prometheus-config
      - name: data
        emptyDir: {}
      # No fixed runAsUser -- the default restricted-v2 SCC assigns one from the namespace's
      # allocated range; the upstream Prometheus image already runs as an arbitrary non-root
      # UID by default.
---
apiVersion: v1
kind: Service
metadata:
  name: demo-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: demo-prometheus
spec:
  selector:
    app: demo-prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
{{- end }}
