{{- if .Values.policies.certificateFileAccess.enabled }}
# OpenShift/Kubernetes variant of tetragon-policies/certificate-file-access.yaml -- adds a
# kernel-side exclusion for kubelet's bind-mounted CA bundles (see below). TracingPolicy is a
# cluster-scoped CRD; installing this chart more than once in the same cluster only needs one
# copy enabled (see values.yaml).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: certificate-file-access
spec:
  kprobes:
  - call: "fd_install"
    syscall: false
    return: false
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "file"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Postfix"
        values:
        - ".crt"
        - ".pem"
        - ".cert"
        - ".cer"
        - ".jks"
        - ".keystore"
        - ".truststore"
        - ".p12"
        - ".pfx"
      # Kubelet bind-mounts the same handful of underlying CA bundles/service-account certs
      # into every pod's projected volume under /var/lib/kubelet/pods/. Without this
      # exclusion, fd_install fires once per pod per mount for what's usually the same
      # underlying cert content, so known_certs cardinality grows roughly linearly with pod
      # count rather than with distinct certs on the node. Filtering here means the event
      # never leaves the kernel for these paths at all.
      - index: 1
        operator: "NotPrefix"
        values:
        - "/var/lib/kubelet/pods/"
      matchActions:
      - action: Post
{{- end }}
