{{- if .Values.policies.certificateFileAccess.enabled }}
# OpenShift/Kubernetes variant of tetragon-policies/certificate-file-access.yaml -- adds a
# kernel-side exclusion for kubelet's bind-mounted CA bundles (see below). TracingPolicy is a
# cluster-scoped CRD; installing this chart more than once in the same cluster only needs one
# copy enabled (see values.yaml).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: certificate-file-access
spec:
  kprobes:
  - call: "fd_install"
    syscall: false
    return: false
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "file"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Postfix"
        values:
        - ".crt"
        - ".pem"
        - ".cert"
        - ".cer"
        - ".jks"
        - ".keystore"
        - ".truststore"
        - ".p12"
        - ".pfx"
      # Kubelet bind-mounts the same handful of underlying CA bundles/service-account certs
      # into every pod's projected volume under /var/lib/kubelet/pods/. Without this
      # exclusion, fd_install fires once per pod per mount for what's usually the same
      # underlying cert content, so known_certs cardinality grows roughly linearly with pod
      # count rather than with distinct certs on the node. Filtering here means the event
      # never leaves the kernel for these paths at all.
      #
      # /run/secrets/kubernetes.io/serviceaccount/ (and its /var/run alias) is the same
      # projected volume as seen from inside each pod's own mount namespace -- a distinct
      # string from the kubelet path above, not covered by it. Confirmed live on the CRC
      # pilot cluster (2026-07-24): cluster-version-operator alone re-opened its own
      # .../ca.crt ~6,400 times/minute in a recurring burst, 93% of all cert-file-access
      # events during that window, for a CA bundle identical across virtually every pod on
      # the node. Scoped to this one path, not a broader /run/secrets/ sweep -- other paths
      # under there (webhook serving certs, etcd client certs) are genuine leaf certs this
      # tool exists to monitor.
      - index: 1
        operator: "NotPrefix"
        values:
        - "/var/lib/kubelet/pods/"
        - "/run/secrets/kubernetes.io/serviceaccount/"
        - "/var/run/secrets/kubernetes.io/serviceaccount/"
      {{- if .Values.policies.certificateFileAccess.excludeOperatorBinaries }}
      # CRC-pilot addition (see values.yaml): excludes core cluster-operator binaries so
      # their own cert/CA-bundle reads never leave the kernel -- they're control-plane
      # components, not application workloads this tool exists to monitor. Off by default;
      # enabled via examples/crc-demo-values.yaml. Same effect as the standalone
      # tetragon-policies/openshift/certificate-file-access-crc.yaml for non-Helm clusters --
      # keep the binary list in values.yaml's operatorBinaries in sync with that file.
      matchBinaries:
      - operator: "NotIn"
        values:
        {{- range .Values.policies.certificateFileAccess.operatorBinaries }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
      matchActions:
      - action: Post
{{- end }}
