apiVersion: v1
kind: Service
metadata:
  name: cert-expiry-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-analyzer.labels" . | nindent 4 }}
    app: cert-expiry-monitor
spec:
  selector:
    app: cert-expiry-monitor
  ports:
  - name: metrics
    port: {{ .Values.ports.metrics }}
    targetPort: {{ .Values.ports.metrics }}
    protocol: TCP
  - name: health
    port: {{ .Values.ports.health }}
    targetPort: {{ .Values.ports.health }}
    protocol: TCP
  type: {{ .Values.service.type }}
