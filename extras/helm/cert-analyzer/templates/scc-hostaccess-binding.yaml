{{- if .Values.scc.hostaccess.enabled }}
# Grants the ServiceAccount the 'hostaccess' SCC, which permits the hostNetwork/hostPID/
# hostPath access the DaemonSet needs while still enforcing a namespace-allocated non-root
# UID and SELinux context. Equivalent to:
#   oc adm policy add-scc-to-user hostaccess -z {{ .Values.serviceAccount.name }} -n {{ .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccount.name }}-hostaccess-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-analyzer.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: system:openshift:scc:hostaccess
  apiGroup: rbac.authorization.k8s.io
{{- end }}
