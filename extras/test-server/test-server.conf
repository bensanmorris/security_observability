# certsight-test-server configuration
# /etc/certsight-test-server/test-server.conf
#
# This is a systemd EnvironmentFile (shell KEY=VALUE, not a Python config
# file) -- see server.py's parse_args() for the TEST_SERVER_* variables it
# reads. Only used when running under systemd; the `certsight-test-server`
# / `python3 server.py` CLI flags still work standalone and take
# precedence over anything set here.
#
# SPDX-License-Identifier: Apache-2.0

# Required -- same broker cert-analyzer's [kafka] bootstrap_servers points
# at. The service fails to start (with a clear error in the journal) until
# both of these are set.
#TEST_SERVER_KAFKA_HOST=localhost
#TEST_SERVER_KAFKA_PORT=9092

# Optional overrides
#TEST_SERVER_TOPIC=cert-analyzer-events
#TEST_SERVER_PORT=8090

# Prometheus base URL the "Certificate blast radius explorer" link queries
# on click (default: http://localhost:9090). Only needs to be set if
# Prometheus isn't reachable at the default address from this host.
#TEST_SERVER_PROMETHEUS_URL=http://localhost:9090

# Listen address. Defaults to 0.0.0.0 (all interfaces) here so the console
# is reachable from elsewhere on the lab network without extra flags, since
# a systemd-managed instance is typically running on a headless host.
#
# WARNING: every use case executes a real, hardcoded action on this host
# for any HTTP request that reaches it, with no authentication. Only run
# this on a trusted lab network behind a firewall -- never on a host
# reachable from the open internet or an untrusted network.
TEST_SERVER_BIND=0.0.0.0
