<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CertSight detection test console</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>CertSight detection test console</h1>
    <p>Pick a use case on the left to trigger it on this host. Matching <strong>CertSight</strong> Kafka events appear on the right as they arrive.</p>
  </header>
  <main>
    <section id="use-cases-pane">
      <h2>Use cases</h2>
      <ul id="use-case-list"></ul>
      <div id="run-status"></div>
    </section>
    <section id="events-pane">
      <h2>Kafka events</h2>
      <div id="event-log"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
