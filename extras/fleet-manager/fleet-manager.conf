# certsight-fleet-manager configuration
# /etc/certsight-fleet-manager/fleet-manager.conf
#
# This is a systemd EnvironmentFile (shell KEY=VALUE, not a Python config
# file) -- see server.py's parse_args() for the FLEET_MANAGER_* variables it
# reads. The `python3 server.py` CLI reads the same variables directly and
# its flags take precedence when both are given.
#
# This file holds two secrets (the admin password hash and the node token)
# and must stay root:certsight-fleet-manager 0640.
#
# SPDX-License-Identifier: Apache-2.0

# Accounts. There is no unauthenticated mode and no default password.
# Generate a hash with:
#   certsight-fleet-manager --hash-password      (RPM install)
#   python3 server.py --hash-password            (source checkout)
#
# admin -- may change policies. Required unless this is a read-only
# deployment (a viewer account or anonymous viewers below, and nothing
# else): then the console is provably read-only, no session can write.
FLEET_MANAGER_ADMIN_PASSWORD_HASH=
#FLEET_MANAGER_ADMIN_USER=admin
#
# viewer -- optional read-only account: every page, no toggles. The role
# is enforced server-side (403 on every write route), the UI only
# reflects it. For an on-call rota or an auditor who should see the
# matrix and the audit log but never change a node. The landing page's
# form stays the administrators'; a "Read-only viewer access" link under
# it asks for this account's password as a single access code.
#FLEET_MANAGER_VIEWER_PASSWORD_HASH=
#FLEET_MANAGER_VIEWER_USER=viewer
#
# Anonymous viewers -- the landing page offers "Continue as read-only
# viewer", one click and no credentials (a "Sign in" button in the view
# leads back to the admin form if one exists). For a demo or a wallboard
# behind a network you already trust. The optional note is shown beside
# the link and in the read-only banner.
#FLEET_MANAGER_ANONYMOUS_VIEWER=1
#FLEET_MANAGER_READ_ONLY_NOTE=Public demo: sign in as admin to change anything.

# Node authentication -- one or both, matching each node's [control] in
# /etc/cert-analyzer/cert-analyzer.conf:
#
# (a) the shared bearer token (the nodes' `token`). Nodes whose token
#     doesn't match show as "unauthorized" and can't be toggled.
FLEET_MANAGER_NODE_TOKEN=
#
# (b) mutual TLS: the CA that signed the nodes' `tls_cert` (turns node
#     URLs to https and verifies each node's cert + SAN), and this
#     console's own client certificate for nodes with `tls_client_ca`.
#     Its CN must be in the nodes' `authorized_clients` to change anything;
#     a CN in `readonly_clients` makes this console a read-only client of
#     that node, which it shows as such (the node tells it its role).
#     gen-control-certs.sh produces a matching set.
#
# With neither set, every node refuses this console and the UI says so.
# Each node's Control column also says *why* it can't be changed from
# here -- cert-analyzer-control not installed, [control] off, listener on
# but unreachable, read-only client -- from the node's own
# cert_analyzer_config_info{fleet_control} plus what its listener answers.
#FLEET_MANAGER_NODE_TLS_CA=/etc/certsight-fleet-manager/control-ca.crt
#FLEET_MANAGER_NODE_CLIENT_CERT=/etc/certsight-fleet-manager/fleet-manager.crt
#FLEET_MANAGER_NODE_CLIENT_KEY=/etc/certsight-fleet-manager/fleet-manager.key
# Set to 0 only if node certificates can't carry the address this console
# dials as a SAN; CA verification still applies.
#FLEET_MANAGER_NODE_TLS_VERIFY_HOSTNAME=1

# Prometheus that scrapes every cert-analyzer node (default:
# http://127.0.0.1:9090). Deliberately an IPv4 literal, not "localhost" --
# see test-server.conf's note on hosts with IPv6 disabled.
#FLEET_MANAGER_PROMETHEUS_URL=http://127.0.0.1:9090

# cert-analyzer's [control] listen port on every node (default 8087). The
# control URL for a node is <scheme>://<its Prometheus scrape host>:<port>,
# scheme https when a node CA or client cert is set above, else http. For
# nodes where that's wrong (a node whose [control] listens on loopback and
# is reached through an SSH tunnel, a k8s pod scraped through a
# Service/Route, NAT), list them in a JSON file of node_name -> URL:
#   { "web-01": "http://127.0.0.1:18087", "k8s-a": "https://10.0.1.9:8087" }
#FLEET_MANAGER_CONTROL_PORT=8087
#FLEET_MANAGER_CONTROL_SCHEME=https
#FLEET_MANAGER_NODE_OVERRIDES=/etc/certsight-fleet-manager/nodes.json

# Listen address/port. Loopback by default: this console can switch
# detection off fleet-wide, so anything reachable from beyond this host
# goes behind nginx with TLS (see extras/aws-demo/user-data.sh for the
# pattern the test console and MCP server already use). When behind TLS,
# the session cookie is marked Secure automatically if the proxy sends
# X-Forwarded-Proto: https; set FLEET_MANAGER_COOKIE_SECURE=1 to force it.
#FLEET_MANAGER_BIND=127.0.0.1
#FLEET_MANAGER_PORT=8094
#FLEET_MANAGER_COOKIE_SECURE=1

# Append-only JSONL record of every login and policy change (also mirrored
# to the journal at WARNING). The unit's StateDirectory= creates the dir.
FLEET_MANAGER_AUDIT_LOG=/var/lib/certsight-fleet-manager/audit.jsonl

# Per-node HTTP timeout for /control calls, and how long one fan-out to
# every node's control endpoint is reused before it's redone.
#FLEET_MANAGER_NODE_TIMEOUT=5
#FLEET_MANAGER_CACHE_SECONDS=15
