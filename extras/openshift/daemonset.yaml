apiVersion: v1
kind: Namespace
metadata:
  name: certsight
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-expiry-monitor
  namespace: certsight
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cert-expiry-monitor
  namespace: certsight
  labels:
    app: cert-expiry-monitor
spec:
  selector:
    matchLabels:
      app: cert-expiry-monitor
  template:
    metadata:
      labels:
        app: cert-expiry-monitor
    spec:
      serviceAccountName: cert-expiry-monitor
      hostNetwork: true
      hostPID: true
      containers:
      - name: analyzer
        # Internal OpenShift registry path (see extras/OPENSHIFT-DEPLOYMENT-README.md for how
        # this gets populated). Pinned to a versioned tag, not 'latest': rebuild-redeploy-
        # cert-analyzer.sh pushes a fresh dev-<timestamp> tag and points the *live* DaemonSet
        # at it via 'oc set image', but never touches this file or the registry's 'latest' tag
        # -- any later plain 'oc apply -f daemonset.yaml' (e.g. for an unrelated env var change)
        # would silently revert the running image back to whatever 'latest' last pointed to,
        # undoing the rebuild. dev-1784286667 is the build with the bind-probe fib_trie fix and
        # BIND_PROBE_ENABLED/CONNECT_PROBE_ENABLED support -- update this whenever
        # rebuild-redeploy-cert-analyzer.sh ships a build you want to keep.
        image: image-registry.openshift-image-registry.svc:5000/certsight/cert-analyzer:dev-1784286667
        imagePullPolicy: IfNotPresent
        env:
        - name: TETRAGON_ADDR
          # Confirmed against the running cilium/tetragon 1.7.0 chart: the agent's gRPC
          # socket lives at /var/run/tetragon/tetragon.sock, NOT /var/run/cilium/tetragon/
          # (that path is only used for the export log file) - the vanilla kubernetes/
          # deployment.yaml in this repo predates this and points at the wrong path.
          value: "unix:///var/run/tetragon/tetragon.sock"
        - name: METRICS_PORT
          value: "9090"
        - name: HEALTH_PORT
          value: "8086"
        - name: ALERT_THRESHOLD_DAYS
          value: "30"
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: CERT_SCAN_PATHS
          # Empty disables the periodic scanner entirely (agent/config.py only starts that
          # thread when scan_paths is non-empty) -- off for the OpenShift demo so cert
          # discovery is purely event-driven (Tetragon kprobes/uprobes), matching what's
          # actually being demonstrated. SCAN_INTERVAL_SECONDS below is unused while this is
          # empty.
          value: ""
        - name: SCAN_INTERVAL_SECONDS
          value: "3600"
        - name: READINESS_GRACE_PERIOD_SECONDS
          value: "60"
        - name: READINESS_STALENESS_SECONDS
          value: "300"
        - name: HOST_PREFIX
          value: "/host"
        - name: KAFKA_ENABLED
          value: "true"
        - name: KAFKA_BOOTSTRAP_SERVERS
          # The value below is a substitution placeholder --
          # rebuild-redeploy-cert-analyzer.sh fills it in (--kafka-host if
          # given, else the host's auto-detected default-route IP) before
          # applying. Don't 'oc apply' this file directly; the raw
          # placeholder is not a resolvable address. See the Kafka
          # reachability section of extras/OPENSHIFT-DEPLOYMENT-README.md --
          # this DaemonSet runs with hostNetwork: true, so once the host
          # broker's listeners/advertised.listeners are off localhost and
          # firewalld allows 9092/tcp, it reaches Kafka directly.
          value: "__KAFKA_BOOTSTRAP_SERVERS__"
        - name: BIND_PROBE_ENABLED
          # Off by default (agent/config.py) -- without this, security_socket_bind/sys_bind
          # kprobe events still arrive and increment tls_socket_bind_events_total, but
          # _handle_tls_bind_event never runs, so no probe is scheduled and no Kafka event is
          # published. The test-server's 'tls-bind-probe' use case needs this on to produce its
          # second (bind) Kafka event.
          value: "true"
        - name: CONNECT_PROBE_ENABLED
          # Same gap as BIND_PROBE_ENABLED above, for the tcp_connect use case's outbound-probe
          # Kafka event.
          value: "true"
        volumeMounts:
        - name: tetragon-sock
          mountPath: /var/run/tetragon
        - name: host-root
          mountPath: /host
          readOnly: true
        resources:
          limits:
            # Doubled from 256Mi after a soak test OOMKilled the container at
            # 67 minutes under sustained load. The app's own
            # cert_analyzer_process_rss_bytes never exceeded ~196MB, and
            # cert_analyzer_cache_known_certs_size was nowhere near its
            # 10,000-entry cap, so this wasn't the known_certs cache growing
            # unbounded -- the working theory is cgroup page-cache pressure
            # from the sheer volume of cert file reads (thousands/minute on a
            # busy node) counting against the container's memory.max even
            # though the process's own heap looked fine. See
            # probe_tests/openshift-soak/ for the reproduction.
            memory: 512Mi
            cpu: 200m
          requests:
            memory: 128Mi
            cpu: 100m
        ports:
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 8086
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 2
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          # No explicit seccompProfile: the 'hostaccess' SCC advertises
          # seccompProfiles: ["runtime/default"] as allowed, but in practice this cluster's
          # SCC admission rejects any pod that sets securityContext.seccompProfile at all
          # (pod-level or container-level) for this SA - confirmed via
          # `oc adm policy scc-review`. Omitting the field entirely admits fine; hostaccess's
          # own default is applied. Worth re-testing against the real pilot cluster in case
          # this is CRC-bundle-specific.
      securityContext:
        # No fixed runAsUser: the 'hostaccess' SCC (see scc-hostaccess-binding.yaml) enforces
        # MustRunAsRange, so a UID from the certsight namespace's allocated range is assigned
        # automatically. The Tetragon gRPC socket is root:root mode 0660 on the host
        # (srw-rw----), so the container needs supplemental group 0 (root) to read/write it -
        # this is the standard way to reach a root-owned hostPath socket without running as
        # root itself.
        supplementalGroups:
        - 0
      volumes:
      - name: tetragon-sock
        hostPath:
          path: /var/run/tetragon
          type: DirectoryOrCreate
      - name: host-root
        hostPath:
          path: /
          type: Directory
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: cert-expiry-monitor
  namespace: certsight
  labels:
    app: cert-expiry-monitor
spec:
  selector:
    app: cert-expiry-monitor
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: health
    port: 8086
    targetPort: 8086
    protocol: TCP
  type: ClusterIP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-expiry-monitor-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-expiry-monitor-pod-reader
subjects:
  - kind: ServiceAccount
    name: cert-expiry-monitor
    namespace: certsight
roleRef:
  kind: ClusterRole
  name: cert-expiry-monitor-pod-reader
  apiGroup: rbac.authorization.k8s.io
