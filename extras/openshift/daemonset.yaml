apiVersion: v1
kind: Namespace
metadata:
  name: certsight
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-expiry-monitor
  namespace: certsight
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cert-expiry-monitor
  namespace: certsight
  labels:
    app: cert-expiry-monitor
spec:
  selector:
    matchLabels:
      app: cert-expiry-monitor
  template:
    metadata:
      labels:
        app: cert-expiry-monitor
    spec:
      serviceAccountName: cert-expiry-monitor
      hostNetwork: true
      hostPID: true
      containers:
      - name: analyzer
        # Internal OpenShift registry path (see extras/OPENSHIFT-DEPLOYMENT-README.md for how
        # this gets populated). Avoid 'latest' in production - use a versioned tag.
        image: image-registry.openshift-image-registry.svc:5000/certsight/cert-analyzer:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: TETRAGON_ADDR
          # Confirmed against the running cilium/tetragon 1.7.0 chart: the agent's gRPC
          # socket lives at /var/run/tetragon/tetragon.sock, NOT /var/run/cilium/tetragon/
          # (that path is only used for the export log file) - the vanilla kubernetes/
          # deployment.yaml in this repo predates this and points at the wrong path.
          value: "unix:///var/run/tetragon/tetragon.sock"
        - name: METRICS_PORT
          value: "9090"
        - name: HEALTH_PORT
          value: "8086"
        - name: ALERT_THRESHOLD_DAYS
          value: "30"
        - name: LOG_LEVEL
          value: "DEBUG"
        - name: CERT_SCAN_PATHS
          value: "/host/etc/ssl,/host/etc/pki,/host/etc/kubernetes/pki"
        - name: SCAN_INTERVAL_SECONDS
          value: "3600"
        - name: READINESS_GRACE_PERIOD_SECONDS
          value: "60"
        - name: READINESS_STALENESS_SECONDS
          value: "300"
        - name: HOST_PREFIX
          value: "/host"
        volumeMounts:
        - name: tetragon-sock
          mountPath: /var/run/tetragon
        - name: host-root
          mountPath: /host
          readOnly: true
        resources:
          limits:
            # Doubled from 256Mi after a soak test OOMKilled the container at
            # 67 minutes under sustained load. The app's own
            # cert_analyzer_process_rss_bytes never exceeded ~196MB, and
            # cert_analyzer_cache_known_certs_size was nowhere near its
            # 10,000-entry cap, so this wasn't the known_certs cache growing
            # unbounded -- the working theory is cgroup page-cache pressure
            # from the sheer volume of cert file reads (thousands/minute on a
            # busy node) counting against the container's memory.max even
            # though the process's own heap looked fine. See
            # probe_tests/openshift-soak/ for the reproduction.
            memory: 512Mi
            cpu: 200m
          requests:
            memory: 128Mi
            cpu: 100m
        ports:
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 8086
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8086
          initialDelaySeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 15
          failureThreshold: 2
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          # No explicit seccompProfile: the 'hostaccess' SCC advertises
          # seccompProfiles: ["runtime/default"] as allowed, but in practice this cluster's
          # SCC admission rejects any pod that sets securityContext.seccompProfile at all
          # (pod-level or container-level) for this SA - confirmed via
          # `oc adm policy scc-review`. Omitting the field entirely admits fine; hostaccess's
          # own default is applied. Worth re-testing against the real pilot cluster in case
          # this is CRC-bundle-specific.
      securityContext:
        # No fixed runAsUser: the 'hostaccess' SCC (see scc-hostaccess-binding.yaml) enforces
        # MustRunAsRange, so a UID from the certsight namespace's allocated range is assigned
        # automatically. The Tetragon gRPC socket is root:root mode 0660 on the host
        # (srw-rw----), so the container needs supplemental group 0 (root) to read/write it -
        # this is the standard way to reach a root-owned hostPath socket without running as
        # root itself.
        supplementalGroups:
        - 0
      volumes:
      - name: tetragon-sock
        hostPath:
          path: /var/run/tetragon
          type: DirectoryOrCreate
      - name: host-root
        hostPath:
          path: /
          type: Directory
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: cert-expiry-monitor
  namespace: certsight
  labels:
    app: cert-expiry-monitor
spec:
  selector:
    app: cert-expiry-monitor
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: health
    port: 8086
    targetPort: 8086
    protocol: TCP
  type: ClusterIP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-expiry-monitor-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-expiry-monitor-pod-reader
subjects:
  - kind: ServiceAccount
    name: cert-expiry-monitor
    namespace: certsight
roleRef:
  kind: ClusterRole
  name: cert-expiry-monitor-pod-reader
  apiGroup: rbac.authorization.k8s.io
