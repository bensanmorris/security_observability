apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tcp-connect-tls
  # IMPORTANT: if you add or remove ports from the DPort list below you must
  # also update tls_outbound_ports in /etc/cert-analyzer/cert-analyzer.conf
  # (or TLS_OUTBOUND_PORTS env var). Tetragon filters events here at the kernel
  # boundary; cert-analyzer applies the same list as a Python-side guard.
  # Both must agree or events will be silently dropped by one side.
spec:
  kprobes:
  - call: "tcp_connect"
    syscall: false
    args:
    - index: 0
      type: "sock"
    selectors:
    - matchArgs:
      - index: 0
        operator: "DPort"
        values:
        - "443"
        - "636"
        - "2376"
        - "4443"
        - "5671"
        - "5672"
        - "5986"
        - "6380"
        - "6443"
        - "8140"
        - "8443"
        - "8883"
        - "9093"
        - "9094"
        - "9443"
      matchActions:
      - action: Post
