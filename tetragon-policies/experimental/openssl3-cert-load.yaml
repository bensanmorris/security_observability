apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: openssl3-cert-load
spec:
  uprobes:
  # SSL_CTX_use_certificate_file(SSL_CTX*, const char* file, int type)
  # SSL_CTX_use_certificate_chain_file(SSL_CTX*, const char* file)
  # Hooks applications that load certificate files explicitly via OpenSSL.
  # This covers: openssl s_client -CAfile, nginx, Apache, Java via OpenSSL, etc.
  #
  # RHEL8/9 path — Tetragon v1.1.0 compatible
  - path: "/usr/lib64/libssl.so.3"
    symbols:
    - "SSL_CTX_use_certificate_file"
    - "SSL_CTX_use_certificate_chain_file"
    args:
    - index: 0
      type: "uint64"
    - index: 1
      type: "string"
  # d2i_X509(X509 **px, const unsigned char **in, long len)
  # Hooks in-memory DER certificate loading via libcrypto. This covers Go TLS,
  # curl, and any application that constructs or receives certs in memory rather
  # than loading them from files.
  #
  # The symbol is versioned in the ELF binary (d2i_X509@@OPENSSL_3.0.0), but
  # Go's debug/elf library automatically strips version suffixes when resolving
  # uprobe targets, so specifying the bare symbol name is both necessary and
  # sufficient — this hook works on Tetragon v1.1.0+.
  #
  # RHEL8/9 path — Tetragon v1.1.0 compatible
  - path: "/usr/lib64/libcrypto.so.3"
    symbols:
    - "d2i_X509"
    args:
    - index: 0
      type: "uint64"
    - index: 1
      type: "uint64"
    - index: 2
      type: "int64"
