apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: certificate-file-access
spec:
  kprobes:
  - call: "fd_install"
    syscall: false
    return: false
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "file"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Postfix"
        values:
        - ".crt"
        - ".pem"
        - ".cert"
        - ".cer"
        - ".jks"
        - ".keystore"
        - ".truststore"
        - ".p12"
        - ".pfx"
      # OpenShift/Kubernetes-specific exclusion: kubelet bind-mounts the same
      # handful of underlying CA bundles/service-account certs into every
      # pod's projected volume under /var/lib/kubelet/pods/. Without this,
      # fd_install fires once per pod per mount for what's usually the same
      # underlying cert content, so known_certs cardinality grows roughly
      # linearly with pod count rather than with distinct certs on the node
      # -- on a real cluster this dwarfs every other source of tracked certs
      # combined. Filtering here means the event never leaves the kernel for
      # these paths at all. Not needed in the bare-metal RPM policy
      # (tetragon-policies/certificate-file-access.yaml) since that path
      # doesn't exist there.
      # /run/secrets/kubernetes.io/serviceaccount/ (and its /var/run alias) is where every
      # pod sees its own projected service-account volume from inside its mount namespace --
      # Tetragon reports fd_install paths in the accessing process's own namespace view, so
      # this is a distinct string from the kubelet bind-mount path above, not covered by it.
      # Confirmed live on the CRC pilot cluster (2026-07-24): cluster-version-operator alone
      # re-opened its own .../ca.crt ~6,400 times/minute in a recurring ~4-minute-period
      # burst (retrying against an unreachable update service, typical of a disconnected
      # cluster) -- 93% of all cert-file-access events during that burst, for a CA bundle
      # that's identical across virtually every pod on the node and carries no
      # per-pod-unique expiry information worth tracking. Scoped to this one path, not a
      # broader /run/secrets/ sweep -- other paths under there (webhook serving certs, etcd
      # client certs) are genuine leaf certs this tool exists to monitor.
      - index: 1
        operator: "NotPrefix"
        values:
        - "/var/lib/kubelet/pods/"
        - "/run/secrets/kubernetes.io/serviceaccount/"
        - "/var/run/secrets/kubernetes.io/serviceaccount/"
      matchActions:
      - action: Post
