[Service]
ExecStart=
ExecStart=/usr/local/bin/tetragon \
  --export-filename /var/log/tetragon/tetragon.log \
  --server-address unix:///var/run/tetragon/tetragon.sock \
  --procfs /proc
# Wait for tetragon to create the gRPC socket (can take several seconds while
# BPF programs load) before changing its group. 30 retries × 1 s = 30 s max.
ExecStartPost=/bin/sh -c \
  'i=0; until [ -S /run/tetragon/tetragon.sock ] || [ $i -ge 30 ]; \
   do sleep 1; i=$((i+1)); done; \
   chgrp cert-analyzer /run/tetragon/tetragon.sock'
