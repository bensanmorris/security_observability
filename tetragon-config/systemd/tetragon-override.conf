[Service]
ExecStart=
ExecStart=/usr/local/bin/tetragon \
  --export-filename /var/log/tetragon/tetragon.log \
  --server-address unix:///var/run/tetragon/tetragon.sock \
  --procfs /proc
# Wait for the gRPC socket to be ready before chgrp-ing it.
# Phase 1: if a stale socket exists from a prior crash, wait up to 15 s for
# tetragon to unlink it — otherwise ExecStartPost chgrp's the stale file and
# tetragon then recreates the socket as root:root, leaving cert-analyzer locked out.
# Phase 2: wait up to 30 s for the fresh socket to appear.
ExecStartPost=/bin/sh -c \
  'i=0; while [ -S /run/tetragon/tetragon.sock ] && [ $i -lt 15 ]; \
   do sleep 1; i=$((i+1)); done; \
   i=0; until [ -S /run/tetragon/tetragon.sock ] || [ $i -ge 30 ]; \
   do sleep 1; i=$((i+1)); done; \
   chgrp cert-analyzer /run/tetragon/tetragon.sock'
