# Run the test cert generator as a one-shot Job in kind.
#
# The container writes PEM, JKS and PKCS12 test certificates to /test-certs,
# which is backed by a hostPath on the kind node.  cert-analyzer (deployed via
# kubernetes/deployment.yaml) mounts the host root at /host and scans the paths
# listed in CERT_SCAN_PATHS, so add /host/tmp/cert-analyzer-test to that env var
# if you want the analyzer to pick up these certs automatically.
#
# Usage:
#   # Load the image into the kind cluster first:
#   kind load docker-image ghcr.io/<owner>/cert-test-generator:latest
#
#   kubectl apply -f k8s_enrich_demo/job.yaml
#   kubectl -n kube-system wait --for=condition=complete job/cert-test-generator --timeout=60s
#   kubectl -n kube-system logs job/cert-test-generator
#
# The generated certs will be on the kind node at /tmp/cert-analyzer-test/.
# Access them via a privileged debug pod, or configure cert-analyzer with:
#   CERT_SCAN_PATHS=/host/etc/ssl,/host/etc/pki,/host/tmp/cert-analyzer-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-test-generator
  namespace: kube-system
  labels:
    app: cert-test-generator
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: cert-test-generator
    spec:
      restartPolicy: Never
      containers:
      - name: cert-test-generator
        image: ghcr.io/bensanmorris/cert-test-generator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: TEST_CERT_OUTPUT_DIR
          value: /test-certs
        volumeMounts:
        - name: test-certs
          mountPath: /test-certs
        resources:
          limits:
            memory: 128Mi
            cpu: 200m
          requests:
            memory: 64Mi
            cpu: 100m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1001
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: test-certs
        hostPath:
          # Certs land here on the kind node — readable by cert-analyzer via its
          # /host mount if CERT_SCAN_PATHS includes /host/tmp/cert-analyzer-test
          path: /tmp/cert-analyzer-test
          type: DirectoryOrCreate
