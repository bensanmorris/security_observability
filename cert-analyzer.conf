# cert-analyzer configuration file
# /etc/cert-analyzer/cert-analyzer.conf
#
# Values in this file take precedence over environment variables.
# If this file is absent, environment variables and built-in defaults
# are used — this means Kubernetes deployments work unchanged without
# this file being present.
#
# The config file path can be overridden via the CERT_ANALYZER_CONFIG
# environment variable for non-standard deployments or testing.
#
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2024 Your Organisation

[tetragon]
# gRPC address of the Tetragon daemon socket
addr = unix:///var/run/cilium/tetragon/tetragon.sock

# How often (seconds) to re-check the running Tetragon version
# against the build version (default: 300 — 5 minutes)
#version_check_interval = 300


[metrics]
# Port for the Prometheus metrics endpoint
port = 9090


[health]
# Port for the liveness (/healthz) and readiness (/readyz) probes
port = 8086

# Seconds after startup before readiness checking begins.
# Allows time for the first Tetragon event to arrive before the probe
# can return not-ready.
readiness_grace_period_seconds = 60

# Maximum age (seconds) of the last processed event before the pod is
# marked not-ready. Increase on quiet nodes with infrequent cert access.
readiness_staleness_seconds = 300


[alerting]
# Number of days before expiry at which to emit warning-level log output
threshold_days = 30


[scanning]
# Comma-separated list of directories to scan periodically for certificates
paths = /etc/ssl,/etc/pki

# How often (seconds) to run the periodic directory scan
interval_seconds = 3600


[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO


[cache]
# Maximum number of entries in each LRU cache (known_certs, processed_paths,
# password_failed_paths). Cannot be set below 10,000.
max_size = 10000


[certificates]
# Set to true to compute SHA-256 checksums of parsed certificates.
# Disabled by default — see documentation for use cases.
checksum_enabled = false

# Set to false to allow the analyzer to observe its own certificate
# accesses. Useful for demos showing self-pod enrichment.
filter_self_events = true


[passwords]
# Passwords for encrypted keystores. These are tried before the
# 'changeit' fallback and empty string.
# WARNING: protect this file with appropriate permissions (0640, root:cert-analyzer)
# to avoid exposing passwords in world-readable files.
#jks_password =
#pkcs12_password =
