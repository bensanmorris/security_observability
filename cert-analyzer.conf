# cert-analyzer configuration file
# /etc/cert-analyzer/cert-analyzer.conf
#
# Values in this file take precedence over environment variables.
# If this file is absent, environment variables and built-in defaults
# are used — this means Kubernetes deployments work unchanged without
# this file being present.
#
# The config file path can be overridden via the CERT_ANALYZER_CONFIG
# environment variable for non-standard deployments or testing.
#
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2024 Your Organisation

[tetragon]
# gRPC address of the Tetragon daemon socket
addr = unix:///run/tetragon/tetragon.sock

# How often (seconds) to re-check the running Tetragon version
# against the build version (default: 300 — 5 minutes)
#version_check_interval = 300


[metrics]
# Port for the Prometheus metrics endpoint
port = 9090

# Minimum seconds enforced between real /metrics scrapes. A scraper polling
# faster than this (misconfigured scrape_interval, or anything else hitting
# the endpoint) gets the last real response replayed instead of forcing a
# fresh collect() every time. Set to 0 to disable and serve every request fresh.
min_scrape_interval_seconds = 60

# Set to true to emit per-process TLS event-rate counters
# (tls_tcp_connect_events_total, tls_socket_bind_events_total), labelled by
# process and node_name. Disabled by default to avoid high cardinality in
# environments with many distinct process names.
event_rate_metrics_enabled = false


[health]
# Port for the liveness (/healthz) and readiness (/readyz) probes
port = 8086

# Seconds after startup before readiness checking begins.
# Allows time for the first Tetragon event to arrive before the probe
# can return not-ready.
readiness_grace_period_seconds = 60

# Maximum age (seconds) of the last processed event before the pod is
# marked not-ready. Increase on quiet nodes with infrequent cert access.
readiness_staleness_seconds = 300


[alerting]
# Number of days before expiry at which to emit warning-level log output
threshold_days = 30


[scanning]
# Comma-separated list of directories to scan periodically for certificates.
# Empty disables the periodic scanner thread entirely -- leave empty unless
# you need proactive discovery of certs that live activity alone won't touch;
# the scan runs immediately on startup (no initial delay) and re-processing
# a large existing cert population on every restart drives a burst of
# Prometheus metric/memory growth (see MemoryMax comment in cert-analyzer.service).
paths =

# How often (seconds) to run the periodic directory scan (only applies if paths is set)
interval_seconds = 3600


[logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = WARNING


[cache]
# Maximum number of entries in each LRU cache (known_certs, processed_paths,
# password_failed_paths). Cannot be set below 10,000.
max_size = 10000


[certificates]
# Set to true to compute SHA-256 checksums of parsed certificates.
# Disabled by default — see documentation for use cases.
checksum_enabled = true

# Set to false to disable computing a SHA-256 hash of each certificate's
# SubjectPublicKeyInfo (the public key alone, not the whole cert). Unlike
# checksum above, this value stays the same across a renewal that reuses
# the same key pair, so downstream consumers can compare it across
# successive discoveries of the same certificate to detect key reuse.
# Enabled by default — it's a hash of public, non-sensitive key material.
spki_hash_enabled = true

# Set to false to allow the analyzer to observe its own certificate
# accesses. Useful for demos showing self-pod enrichment.
filter_self_events = true

# Path prefix prepended to certificate paths from Tetragon events.
# Leave empty for standalone RPM deployment — paths are used as-is.
# Set to /host for Kubernetes where the node root filesystem is
# bind-mounted at /host inside the container.
host_prefix =

# When true, certificate details (subject, issuer, serial, validity dates,
# SANs) are logged at INFO level rather than DEBUG, making them visible in
# the journal without changing LOG_LEVEL. For demos only — leave false in
# production to avoid verbose output.
demo_mode = false

# Set to false to disable FIPS 140-2/140-3 compliance checking entirely.
# When disabled, no FIPS metrics are emitted and no compliance violations
# are logged. Useful when FIPS compliance is enforced at the platform level
# and per-certificate checking adds unwanted overhead.
fips_compliance_enabled = true

# Files containing more PEM certificates than this (e.g. a system CA trust
# bundle) are parsed on a background thread instead of the Tetragon
# event-consumer thread, so one large bundle can't delay processing of
# other events.
large_file_cert_threshold = 20

# Caps how many certs in a single bundle file get full Prometheus metrics
# and per-cert logging. Independent of large_file_cert_threshold above —
# that one only controls background-thread parsing; this one bounds
# Prometheus cardinality/memory. Certs beyond the cap are still cached
# internally (known-file lookups stay correct) and still published to
# Kafka if enabled, just not individually tracked in Prometheus. Default
# of 300 comfortably covers a real system CA trust bundle (~130-150
# certs) without truncation. Raise with care: each additional cert here
# costs ~7 Prometheus series.
large_file_metrics_cap = 300

# Caps how many bytes are read to decide whether a file is "large" (see
# large_file_cert_threshold above). Without this cap, that check reads the
# entire file up front on the Tetragon event-consumer thread before any
# background-thread dispatch decision is made — an oversized or degenerate
# file matching a cert extension would block event processing and allocate
# memory proportional to its full size. Default of 2MB comfortably covers
# real-world CA trust bundles (a few hundred KB in practice) while bounding
# the worst case.
large_file_byte_cap = 2097152


[passwords]
# Passwords for encrypted keystores. These are tried before the
# 'changeit' fallback and empty string.
# WARNING: protect this file with appropriate permissions (0640, root:cert-analyzer)
# to avoid exposing passwords in world-readable files.
#jks_password =
#pkcs12_password =

[port_probe]
# Inbound probe: trigger a TLS handshake when a process binds a port, ingesting
# the served certificate. Requires tls-service-tracking-fixed.yaml (or
# tls-service-tracking.yaml) to be loaded. On K8s the container IP is resolved
# from /proc/<pid>/net/fib_trie; on bare metal 127.0.0.1 is used when the bind
# address is 0.0.0.0. Low event volume — safe to enable broadly.
bind_probe_enabled = false

# Outbound probe: trigger a TLS handshake when a process connects to a common
# TLS port (443, 636, 2376, 4443, 5671, 5672, 5986, 6380, 6443, 8140, 8443,
# 8883, 9093, 9094, 9443), making remote server certificate expiry visible
# without per-service configuration. Requires tcp-connect-tls.yaml to be
# loaded. Each unique host:port is probed at most once (O(1) dedup); enable
# with care on hosts with high outbound connection rates.
connect_probe_enabled = false

# Comma-separated list of destination ports to treat as TLS for outbound connect
# probing. Leave commented out to use the built-in defaults shown below.
# IMPORTANT: if you add or remove ports here you must also update the DPort
# values in tetragon-policies/tcp-connect-tls.yaml — the Tetragon policy
# controls which kernel events reach cert-analyzer; this list is a Python-side
# guard for events that pass the kernel filter. Both must agree.
#tls_outbound_ports = 443,636,2376,4443,5671,5672,5986,6380,6443,8140,8443,8883,9093,9094,9443

# Seconds to wait after a bind event before probing (allows TLS initialisation
# to complete before the connection attempt). Applies to bind_probe_enabled only.
connect_delay_seconds = 2

# Seconds before a TLS probe connection attempt times out.
timeout_seconds = 5

# When true, connect_probe (outbound only -- has no effect on bind_probe)
# dials with the real hostname a client's own OpenSSL library was about to
# send as SNI, instead of the raw destination IP, when re-verifying a
# Tetragon-observed outbound connection. Fixes SNI-multiplexed CDN edges
# (Fastly, Cloudflare, CloudFront, ...) returning their generic fallback
# certificate instead of the real one an IP-string SNI matches no vhost on.
# Requires the SSL_ctrl uprobe in openssl3-cert-load.yaml to be loaded
# (RHEL9-class kernels only -- string uprobe args need kernel 6.3+, so this
# has no effect on RHEL8). Off by default: statically-linked/non-OpenSSL
# clients never call SSL_ctrl, so they still fall back to the raw-IP
# behavior either way, and correlation is by PID alone, so a process with
# several concurrent outbound TLS connections at once can have hostnames
# cross-attributed. See extras/PRESENTATION-QA.md's "SNI-multiplexed CDN
# edge" entry.
sni_capture_enabled = false

# How many seconds a captured SNI hostname (see sni_capture_enabled above)
# stays valid for connect_probe to use. Too short and a legitimately slow
# handshake misses the window and falls back to the raw IP; too long risks
# using a stale hostname if the same PID opens another outbound connection
# to a different host before this one's probe runs.
sni_capture_window_seconds = 2


[kafka]
# Set enabled = true to publish new certificate discovery events to Kafka.
# When disabled (the default) the analyzer publishes to Prometheus only.
enabled = false

# Comma-separated list of broker addresses
bootstrap_servers = localhost:9092

# Topic to publish certificate discovery events to
topic = cert-analyzer-events

# Set plain_enabled = false to stop publishing certificate_discovered events
# to the plain-JSON topic above — e.g. once every consumer has migrated to
# connect_topic below. Defaults to true (unchanged behavior); independent of
# access_enabled/connect_enabled.
plain_enabled = true

# Set access_enabled = true to additionally publish certificate_accessed
# events — one per distinct process/pod that re-accesses an already-known
# certificate (capped by [certificates] max_processes_per_cert). Independently
# gated from `enabled` above; defaults to false since this can be materially
# higher volume than discovery events on a busy node.
access_enabled = false

# Topic to publish certificate_accessed events to
access_topic = cert-analyzer-access-events

# Set connect_enabled = true to additionally publish each certificate_discovered
# event wrapped in a Kafka-Connect-compatible JSON envelope
# ({"schema": {...}, "payload": {...}}) to connect_topic, suitable for a stock
# Kafka Connect JDBC Sink connector to consume with no custom code.
# Independently gated from `enabled`/`access_enabled` above; off by default.
connect_enabled = false

# Topic to publish the Kafka-Connect-enveloped certificate_discovered events to
connect_topic = cert-analyzer-events-connect

# Set access_connect_enabled = true to additionally publish each certificate_accessed
# event wrapped in a Kafka-Connect-compatible JSON envelope
# ({"schema": {...}, "payload": {...}}) to access_connect_topic, suitable for a
# stock Kafka Connect JDBC Sink connector to consume with no custom code.
# Independently gated from `access_enabled` above (and from `enabled`/
# `connect_enabled`); off by default.
access_connect_enabled = false

# Topic to publish the Kafka-Connect-enveloped certificate_accessed events to
access_connect_topic = cert-analyzer-access-events-connect

# Security protocol: PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL
security_protocol = PLAINTEXT

# SASL settings — only required when security_protocol is SASL_PLAINTEXT or SASL_SSL
# sasl_mechanism = PLAIN
# sasl_username  =
# sasl_password  =
