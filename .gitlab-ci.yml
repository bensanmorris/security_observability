workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  IMAGE_REPO: $CI_REGISTRY_IMAGE/cert-analyzer
  TETRAGON_VERSION: "v1.1.0"

stages:
  - lint
  - security
  - test
  - build
  - status

default:
  image: python:3.11

# ── Caching ────────────────────────────────────────────────────────────────────
.pip-cache: &pip-cache
  cache:
    key:
      files:
        - test-requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ── Templates ──────────────────────────────────────────────────────────────────
.install-test-deps: &install-test-deps
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r test-requirements.txt

# ── Lint ───────────────────────────────────────────────────────────────────────
lint:
  stage: lint
  <<: *pip-cache
  before_script:
    - pip install flake8 black isort
  script:
    - echo "Checking code formatting with Black..."
    - black --check cert_analyzer.py test_cert_analyzer.py || true
    - echo "Checking import sorting with isort..."
    - isort --check-only cert_analyzer.py test_cert_analyzer.py || true
    - echo "Linting with flake8 (syntax errors and undefined names)..."
    - flake8 cert_analyzer.py test_cert_analyzer.py --count --select=E9,F63,F7,F82 --show-source --statistics
    - echo "Linting with flake8 (warnings)..."
    - flake8 cert_analyzer.py test_cert_analyzer.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - "**.py"
        - "test-requirements.txt"

# ── Security ───────────────────────────────────────────────────────────────────
security:
  stage: security
  <<: *pip-cache
  before_script:
    - pip install bandit safety
    - pip install -r test-requirements.txt
  script:
    - echo "Running Bandit security scan..."
    - bandit -r cert_analyzer.py -f json -o bandit-report.json || true
    - bandit -r cert_analyzer.py || true
    - echo "Checking dependencies for known vulnerabilities..."
    - safety check || true
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ── Test ───────────────────────────────────────────────────────────────────────
.test-base:
  stage: test
  <<: *pip-cache
  <<: *install-test-deps
  script:
    - echo "Running tests..."
    - pytest test_cert_analyzer.py -v --tb=short --strict-markers
    - echo "Generating coverage report..."
    - pytest test_cert_analyzer.py
        --cov=cert_analyzer
        --cov-report=xml:coverage.xml
        --cov-report=html:htmlcov
        --cov-report=term-missing
        --cov-fail-under=35
  needs:
    - lint
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 30 days
  coverage: '/TOTAL.*\s+(\d+%)$/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - "**.py"
        - "test-requirements.txt"

test:python3.9:
  extends: .test-base
  image: python:3.9

test:python3.10:
  extends: .test-base
  image: python:3.10

test:python3.11:
  extends: .test-base
  image: python:3.11

test:python3.12:
  extends: .test-base
  image: python:3.12

# ── Build ───────────────────────────────────────────────────────────────────────
.build_template: &build_template
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - lint
    - security
    - test:python3.11
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Collect all tags into an array
    - |
      TAGS=()
      TAGS+=("$IMAGE_REPO:sha-$CI_COMMIT_SHORT_SHA-ubi${UBI_VERSION}")
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        TAGS+=("$IMAGE_REPO:${CI_COMMIT_BRANCH}-ubi${UBI_VERSION}")
      fi
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TAGS+=("$IMAGE_REPO:latest-ubi${UBI_VERSION}")
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS+=("$IMAGE_REPO:${CI_COMMIT_TAG}-ubi${UBI_VERSION}")
      fi

    # Build tag arguments for docker build
    - |
      TAG_ARGS=""
      for TAG in "${TAGS[@]}"; do
        TAG_ARGS="$TAG_ARGS --tag $TAG"
      done

    # Build
    - |
      docker build \
        --file Containerfile \
        --build-arg UBI_VERSION=${UBI_VERSION} \
        --build-arg PYTHON_VERSION=${PYTHON_VERSION} \
        --build-arg TETRAGON_VERSION=${TETRAGON_VERSION} \
        --cache-from $IMAGE_REPO:${CI_COMMIT_BRANCH}-ubi${UBI_VERSION} \
        $TAG_ARGS \
        .

    # Push only on non-MR pipelines
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        for TAG in "${TAGS[@]}"; do
          echo "Pushing $TAG"
          docker push "$TAG"
        done
      fi
  rules:
    - changes:
        - Containerfile
        - cert_analyzer.py
        - requirements.txt
        - .gitlab-ci.yml

build:ubi8:
  <<: *build_template
  variables:
    UBI_VERSION: "8"
    PYTHON_VERSION: "311"

build:ubi9:
  <<: *build_template
  variables:
    UBI_VERSION: "9"
    PYTHON_VERSION: "311"

# ── Status ─────────────────────────────────────────────────────────────────────
pipeline-status:
  stage: status
  image: alpine:latest
  needs:
    - lint
    - security
    - test:python3.9
    - test:python3.10
    - test:python3.11
    - test:python3.12
    - build:ubi8
    - build:ubi9
  script:
    - echo "✅ All jobs completed successfully"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  when: on_success
