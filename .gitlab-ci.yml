workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  IMAGE_REPO: $CI_REGISTRY_IMAGE/cert-analyzer
  TETRAGON_VERSION: "v1.1.0"

stages:
  - build

.build_template: &build_template
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Collect all tags into an array
    - |
      TAGS=()
      TAGS+=("$IMAGE_REPO:sha-$CI_COMMIT_SHORT_SHA-ubi${UBI_VERSION}")
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        TAGS+=("$IMAGE_REPO:${CI_COMMIT_BRANCH}-ubi${UBI_VERSION}")
      fi
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TAGS+=("$IMAGE_REPO:latest-ubi${UBI_VERSION}")
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS+=("$IMAGE_REPO:${CI_COMMIT_TAG}-ubi${UBI_VERSION}")
      fi

    # Build tag arguments for docker build
    - |
      TAG_ARGS=""
      for TAG in "${TAGS[@]}"; do
        TAG_ARGS="$TAG_ARGS --tag $TAG"
      done

    # Build
    - |
      docker build \
        --file Containerfile \
        --build-arg UBI_VERSION=${UBI_VERSION} \
        --build-arg PYTHON_VERSION=${PYTHON_VERSION} \
        --build-arg TETRAGON_VERSION=${TETRAGON_VERSION} \
        --cache-from $IMAGE_REPO:${CI_COMMIT_BRANCH}-ubi${UBI_VERSION} \
        $TAG_ARGS \
        .

    # Push only on non-MR pipelines
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        for TAG in "${TAGS[@]}"; do
          echo "Pushing $TAG"
          docker push "$TAG"
        done
      fi

  rules:
    - changes:
        - Containerfile
        - cert_analyzer.py
        - requirements.txt
        - .gitlab-ci.yml

build:ubi8:
  <<: *build_template
  variables:
    UBI_VERSION: "8"
    PYTHON_VERSION: "311"

build:ubi9:
  <<: *build_template
  variables:
    UBI_VERSION: "9"
    PYTHON_VERSION: "311"
