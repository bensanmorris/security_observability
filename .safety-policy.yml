# Safety CLI policy file for cert-analyzer.
#
# Used by `safety check -r requirements.txt --policy-file .safety-policy.yml`
# in .github/workflows/ci.yml. Any vulnerability NOT listed below fails CI —
# this file only documents vulnerabilities that are currently known, reviewed,
# and deliberately deferred rather than upgraded immediately. It is not a
# blanket exemption: each entry has a specific, checked reason, and an expiry
# date that forces a re-review rather than letting an ignore go stale forever.
#
# cryptography was upgraded 41.0.7 -> 50.0.1 on 2026-09-04, clearing every
# cryptography CVE that was previously deferred here (including
# CVE-2026-69247, a Bleichenbacher-oracle finding only fixed in >=50.0.0 --
# 46.x, this policy's first target, still had it).
#
# protobuf==4.25.3 and kafka-python==2.0.3 remain several versions behind
# their patched releases (protobuf needs 4.25.8+ or 5.29.6+; kafka-python
# needs 2.3.2+). Upgrading is the real fix and is tracked as separate
# follow-up work, since protobuf 5.x has known generated-code breaking
# changes and both are security-sensitive parsing/protocol libraries that
# deserve a dedicated, tested upgrade rather than a drive-by version bump
# here.
security:
    ignore-unpinned-requirements: True  # psutil and kubernetes are deliberately unpinned
    ignore-cvss-severity-below: 0
    ignore-cvss-unknown-severity: False
    ignore-vulnerabilities:
        # cryptography's 41.0.7-era entries (65647, 65212, 71681, 65510,
        # SFTY-20240205-03700, 71684, 66777, SFTY-20260327-04621, 86217,
        # 66704, SFTY-20260615-96125, 73711, 71680, SFTY-20260803-29229,
        # SFTY-20260803-89041, and SFTY-20260803-51569) were removed
        # 2026-09-04: fixed by the 41.0.7 -> 50.0.1 upgrade, confirmed via a
        # clean `safety check` run against the new pin.
        # -- protobuf 4.25.3 --------------------------------------------------
        85151: # CVE-2026-0994 -- DoS via missing recursion-depth accounting when parsing protobuf messages
            reason: >-
                Moderate relevance: Tetragon's gRPC event stream is the only
                protobuf message source, and Tetragon is a trusted, privileged
                local co-process -- exploitation requires Tetragon itself to
                already be compromised. Defense-in-depth gap, not directly
                attacker-reachable from outside the node.
            expires: '2026-10-04'
        77740: # CVE-2025-4565 -- DoS via unbounded recursion parsing protobuf messages
            reason: "Same reasoning as CVE-2026-0994 (85151) above -- same recursion-DoS class, same trust boundary."
            expires: '2026-10-04'
        # -- kafka-python 2.0.3 -------------------------------------------------
        SFTY-20260611-84190: # CVE-2026-10143 -- DoS via SCRAM authentication handling
            reason: >-
                agent/kafka.py's KafkaProducer wrapper supports sasl_mechanism but
                defaults to security_protocol='PLAINTEXT' with no SASL configured,
                so this isn't reachable in the default/demo deployments seen so
                far. Where a deployment does configure SASL/SCRAM, the broker is
                still within the same trust boundary as the rest of the pipeline
                (same class of argument as the protobuf/Tetragon entries above) --
                exploiting this requires that broker to already be malicious or
                compromised. Real fix is the kafka-python upgrade, tracked
                separately.
            expires: '2026-10-04'
        SFTY-20260611-52551: # CVE-2026-10142 -- DoS via the Kafka wire protocol parser
            reason: >-
                Requires a malicious/compromised broker (or a MITM on the Kafka
                connection) to send a crafted response -- same trust-boundary
                reasoning as the SCRAM entry above and the protobuf/Tetragon
                entries. Real fix is the kafka-python upgrade, tracked separately.
            expires: '2026-10-04'
    continue-on-vulnerability-error: False
